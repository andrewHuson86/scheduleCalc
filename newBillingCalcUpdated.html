<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCSP Billing Calculator</title>
<style>
  :root{
    --paper:#F6F3EC;
    --paper-dim:#EFEAE0;
    --ink:#242320;
    --ink-soft:#6b6659;
    --line:#DCD5C4;
    --line-strong:#c7bea8;
	--purple: #853694;
	--purple-dark: #592461;
	--purple-pale: #efe2f2;
    --holiday:#a8433c;
    --holiday-light:#f2d6d2;
	--profDev:#800080;
    --profDev-light:#CBC3E3;
    --scheduled:#6f7480;
    --scheduled-light:#e4e4e7;
    --attended:#2f5f86;
    --attended-light:#d4e3ee;
    --card:#fffdf9;
    --danger:#a8433c;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  .brandbar{
    background:var(--purple-dark);
    color:#f2ede1;
    padding:18px 28px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:4px solid var(--purple);
  }
  .brandbar .mark{font-family:var(--mono);letter-spacing:.12em;font-size:12px;text-transform:uppercase;opacity:.75;}
  .brandbar h1{font-size:20px;margin:2px 0 0;font-weight:600;letter-spacing:.02em;}
  .brandbar .proj-badge{font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:3px;}
  .topbar{
    background:var(--card);
    border-bottom:1px solid var(--line);
    padding:10px 28px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .topbar .backbtn{
    background:none;border:1px solid var(--line-strong);color:var(--ink-soft);
    padding:6px 12px;border-radius:3px;font-size:13px;
  }
  .topbar .backbtn:hover{background:var(--paper-dim);}
  .topbar .proj-title{font-weight:600;font-size:16px;}
  .topbar .proj-id{font-family:var(--mono);color:var(--ink-soft);font-size:12px;}

 
  #home-screen{max-width:820px;margin:0 auto;padding:40px 24px 80px;}
  .project-list{list-style:none;margin:0 0 32px;padding:0;border-top:1px solid var(--line-strong);}
  .project-row{
    display:flex;align-items:center;gap:16px;
    padding:14px 6px;border-bottom:1px solid var(--line);
  }
  .project-row .tab-no{
    font-family:var(--mono);font-size:13px;color:var(--purple-dark);
    background:var(--purple-pale);padding:4px 8px;border-radius:3px;min-width:54px;text-align:center;
  }
  .project-row .row-name{flex:1;font-size:15px;}
  .project-row .row-meta{font-family:var(--mono);font-size:11px;color:var(--ink-soft);}
  .project-row button{
    background:var(--purple);color:#fff;border:none;padding:7px 16px;border-radius:3px;font-size:13px;
  }
  .project-row button:hover{background:var(--purple-dark);}
  .empty-note{color:var(--ink-soft);font-size:14px;padding:18px 6px;font-style:italic;}

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:5px;
    padding:18px 20px;
    margin-bottom:18px;
  }
  .panel.last{
	margin-bottom: 0px;
  }
  .panel h2{
    font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--purple-dark);
    margin:0 0 14px;border-bottom:1px solid var(--line);padding-bottom:8px;
  }
  .field{margin-bottom:4px;display:flex;flex-direction:column;gap:4px;}
  
  .field label{font-size:12px;color:var(--ink-soft);}
  
  .field input[type=number]
  {
    padding:2px 2px;border:1px solid var(--line-strong);border-radius:3px;background:#fff;font-size:14px;color:var(--ink); width: 12ch;
  }
  
  .field input[type=text]{
    padding:2px 2px;border:1px solid var(--line-strong);border-radius:3px;background:#fff;font-size:14px;color:var(--ink); width: 22ch;
  }
  .field input[type=date]
  {
    padding:2px 2px;border:1px solid var(--line-strong);border-radius:3px;background:#fff;font-size:14px;color:var(--ink); width: 18ch;
  }
  .field input[type=month]
  {
    padding:2px 2px;border:1px solid var(--line-strong);border-radius:3px;background:#fff;font-size:14px;color:var(--ink); width: 12ch;
  }
  .field select{
    padding:2px 2px;border:1px solid var(--line-strong);border-radius:3px;background:#fff;font-size:14px;color:var(--ink); width: 16ch;
  }
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
  
  .primary-btn{
    background:var(--purple);color:#fff;border:none;padding:9px 18px;border-radius:3px;font-size:14px;font-weight:600;
  }
  .primary-btn:hover{background:var(--purple-dark);}
  .ghost-btn{
    background:none;border:1px solid var(--line-strong);color:var(--ink);padding:8px 16px;border-radius:3px;font-size:13px;
  }
  .ghost-btn:hover{background:var(--paper-dim);}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:-4px;}

  .layout{display:grid;grid-template-columns:320px 1fr;gap:20px;max-width:1880px;margin:0 auto;padding:20px 24px 10px;align-items:start;}
 

  .top-row{display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:20px;max-width:1880px;margin:0 auto;padding:20px 24px 0;align-items:stretch;}
 
  .chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chip{
    font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:14px;border:1px solid var(--line-strong);
    background:var(--paper-dim);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .chip.active{background:var(--purple);border-color:var(--purple);color:#fff;}
  .chip .x{opacity:.6;font-weight:700;}
  .chip .x:hover{opacity:1;color:var(--danger);}
  .add-inline{display:flex;gap:8px;align-items:center;}
  .add-inline input,.add-inline select{flex:1;padding:7px 9px;border:1px solid var(--line-strong);border-radius:3px;font-size:13px;}
  .add-inline button{white-space:nowrap;background:var(--purple);color:#fff;border:none;padding:7px 12px;border-radius:3px;font-size:13px;}
  .add-inline button:hover{background:var(--purple-dark);}

  .child-row{
    display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .child-row:last-of-type{border-bottom:none;}
  .child-row.active{background:var(--purple-pale);border-radius:3px;}
  .child-row .radio-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong);flex-shrink:0;}
  .child-row.active .radio-dot{border-color:var(--purple);background:var(--purple);}
  .child-row .cname{flex:1;font-size:14px;}
  .child-row .cid{font-family:var(--mono);font-size:11px;color:var(--ink-soft);}
  .child-row .rm{background:none;border:none;color:var(--ink-soft);font-size:15px;padding:2px 6px;}
  .child-row .rm:hover{color:var(--danger);}

  .tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--line);}
  .tab-btn{
    background:none;border:none;padding:8px 14px;font-size:13px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab-btn.active{color:var(--purple-dark);border-bottom-color:var(--purple);font-weight:600;}
  .weekday-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px;}
  .wd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-soft);}
  .wd input{margin:0;}
  .radio-line{display:flex;gap:16px;font-size:13px;margin-bottom:10px;}
  .radio-line label{display:flex;align-items:center;gap:5px;cursor:pointer;}

  .no-child-note{color:var(--ink-soft);font-size:13px;font-style:italic;padding:8px 2px;}

  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-header h2{margin:0;border:none;padding:0;font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink);}
  .cal-header .cal-sub{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-bottom:10px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
  .weekday-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
  .weekday-labels div{text-align:center;font-size:11px;color:var(--ink-soft);font-family:var(--mono);}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  section.panel.calendar-panel {margin-bottom:0px;}
  .day-cell{
    min-height:96px;border:1px solid var(--line);border-radius:4px;background:var(--paper-dim);
    padding:5px;display:flex;flex-direction:column;gap:3px;position:relative;
  }
  .day-cell.weekday{background:#FFFFFF;min-height:96px;border:1px solid #000000;border-radius:4px;
    padding:5px;display:flex;flex-direction:column;gap:3px;position:relative;}
	
  .day-cell.legalHoliday{background:#98FB98;min-height:96px;border:1px solid var(--line);border-radius:4px;
    padding:5px;display:flex;flex-direction:column;gap:3px;position:relative;}
	
  .day-cell.empty{background:transparent;border:none;}
  
  .day-num{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-align:right;}
  .period{
    font-size:10.5px;padding:2px 5px;border-radius:2px;cursor:pointer;line-height:1.35;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .period:hover{filter:brightness(0.94);}
  .period.attended{background:var(--attended-light);border-left:3px solid var(--attended);color:var(--purple-dark);}
  .period.scheduled{background:var(--scheduled-light);border-left:3px solid var(--scheduled);color:#3a3d44;}
  .period.holiday{background:var(--holiday-light);border-left:3px solid var(--holiday);color:#6e2b26;}
  .period.profdev{background:var(--profDev-light);border-left:3px solid var(--profDev);color:#800080;}

 .results{
	padding-top: 0px;
	padding-right: 20px;
	padding-bottom: 0px;
	padding-left: 20px;}

  table.totals{width:100%;border-collapse:collapse;font-size:13px;}
  table.totals th,table.totals td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);}
  table.totals th:first-child,table.totals td:first-child{text-align:left;}
  table.totals thead th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);border-bottom:1px solid var(--line-strong);}
  table.totals td{font-family:var(--mono);}
  table.totals tr:last-child td{font-weight:700;border-top:1px solid var(--line-strong);border-bottom:none;}


  .modal-overlay{
    position:fixed;inset:0;background:rgba(28,26,20,.45);display:flex;align-items:center;justify-content:center;z-index:50;
  }
  .modal-box{
    background:var(--card);border-radius:6px;padding:22px 24px;width:340px;max-width:90vw;
    border:1px solid var(--line-strong);
  }
  .modal-box h3{margin:0 0 14px;font-size:15px;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:16px;gap:8px;}
  .modal-actions .danger-btn{background:none;border:1px solid var(--holiday);color:var(--holiday);padding:8px 14px;border-radius:3px;font-size:13px;}
  .modal-actions .danger-btn:hover{background:var(--holiday-light);}

  .section-flex{display:flex;justify-content:space-between;align-items:center;}
  ::selection{background:var(--purple-pale);}
</style>
</head>
<body>

<div id="home-screen" style="display:none;">
  <div class="brandbar">
    <div>
      <div class="mark">CCSP Billing Calculator</div>
      <h1>Projects</h1>
    </div>
  </div>
  <div id="home-content"></div>
</div>

<div id="app-screen" style="display:none;">
  <div class="brandbar">
    <div>
      <div class="mark">CCSP Billing Calculator</div>
      <h1 id="app-project-name"></h1>
    </div>
    <div class="proj-badge" id="app-project-badge"></div>
  </div>
  <div class="topbar">
    <button class="backbtn" onclick="goHome()">&larr; All Projects</button>
	<button class="primary-btn" onclick="expProject()"> Export Project</button>
	<button class="primary-btn" onclick="expToCSV()"> Download Project Data (CSV)</button>
	<button class="primary-btn" onclick="importAttendanceCsv()"> Import Attendance Records (CSV)</button>
  </div>
  <div class="top-row" id="top-row"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>
  
  <div class="results" id="results"></div>
</div>

<div id="modal-root"></div>

<script>
// Sorry if you are looking at this, yes it is an Andrew project...  >:(
// TODO List:

const IDX_KEY = "billing_index";
const PROJ_PREFIX = "billing_project_";
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

let project = null;
let editing = null;      // {childId, dateStr, idx}
let editingAuth = null;  // authorization id currently open in the edit modal, or null
let scheduleTab = "single";
let recurWeekdays = [false,false,false,false,false,false,false];

 function loadIndex()
  {
    try
	{ 
		return JSON.parse(localStorage.getItem(IDX_KEY)) || []; 
	}
    catch(e)
	{ 
		return [];
	}
  }
  
  function saveIndex(idx)
  { 
	localStorage.setItem(IDX_KEY, JSON.stringify(idx)); 
  }
  
  function loadProjectById(id)
  {
    try
	{ 
		return JSON.parse(localStorage.getItem(PROJ_PREFIX+id)); 
		}
    catch(e)
	{
		return null;
	}
  }
  
  function saveProject()
  {
    if(!project) return;
    localStorage.setItem(PROJ_PREFIX+project.id, JSON.stringify(project));
  }

  function init()
  {
    renderHome();
    document.getElementById("home-screen").style.display = "block";
  }

  function goHome()
  {
    project = null;
    editing = null;
    editingAuth = null;
    document.getElementById("app-screen").style.display = "none";
    renderHome();
    document.getElementById("home-screen").style.display = "block";
  }

  function openProject(id)
  {
    const p = loadProjectById(id);
    if(!p){ alert("That project could not be loaded."); return; }
    if(!p.authData) p.authData = {};   // backward-compat for projects saved/imported before Authorization Data existed
    if(!p.authList) p.authList = {};   // backward-compat for projects saved/imported before the Authorizations list existed
    migrateLegacyAuthData(p);
    project = p;
    editing = null;
    editingAuth = null;
    scheduleTab = "single";
    recurWeekdays = [false,false,false,false,false,false,false];
    document.getElementById("home-screen").style.display = "none";
    document.getElementById("app-screen").style.display = "block";
    renderApp();
  }
  
  function deleteProject(id)
  {
	let idx = loadIndex();
	idx = idx.filter(e => e.id !== id);
	saveIndex(idx);
    localStorage.removeItem(PROJ_PREFIX + id);
	goHome();
  }

  function renderHome()
  {
    const idx = loadIndex().slice().sort((a,b)=>a.id-b.id);
    let rows = "";
    if(idx.length === 0)
	{
      rows = '<div class="empty-note">No projects yet. Start one below.</div>';
    } else 
	{
      rows = '<ul class="project-list">' + idx.map(p => `
        <li class="project-row">
          <span class="tab-no">No. ${String(p.id).padStart(3,"0")}</span>
          <span class="row-name">${escapeHtml(p.name)}</span>
          <button onclick="openProject(${p.id})">Open</button>
		  <button style="background-color:red; color:white;" onclick="deleteProject(${p.id})">Delete</button>
        </li>`).join("") + "</ul>";
    }

    const maxMonth = maxSelectableMonth();

    document.getElementById("home-content").innerHTML = `
      <div class="panel">
        <h2>Saved Projects</h2>
        ${rows}
      </div>
      <div class="panel">
        <h2>Start a New Project</h2>
        <div class="field">
          <label for="np-name">Project name</label>
          <input type="text" id="np-name" placeholder="e.g. Smith Case">
        </div>
        <div class="row-2">
          <div class="field">
            <label for="np-start">First month</label>
            <input type="month" id="np-start" max="${maxMonth}">
          </div>
          <div class="field">
            <label for="np-end">Last month</label>
            <input type="month" id="np-end" max="${maxMonth}">
          </div>
        </div>
        <div class="hint">Only fully completed prior months can be selected. The range must span at least one month.</div>
        <div style="margin-top:14px;">
          <button class="primary-btn" onclick="createProject()">Create Project</button>
		  <input type="file" id="importFile" accept=".csch" style="display:none" onchange="importProject(event)">
		  <button class="primary-btn" onclick="document.getElementById('importFile').click()">Import Project</button>
        </div>
      </div>`;
  }

function importProject(event)
{	
	const file = event.target.files[0];
    if (!file) return;
	
	const idx = loadIndex();
    const reader = new FileReader();
    reader.onload = function(e) 
	{
        try 
		{
            const data = JSON.parse(e.target.result);
			// If project exists with same name, prompt to overwrite or add new.
			const exists = idx.filter(e=>e.name === data.name).length;
			let overwrite = false;
			
			if(exists > 0)
			{
				if(exists === 1) 
				{
					if (confirm("A project already exists with this name, click OK to overwrite it, or Cancel to import as a new project.")) 
					{
						overwrite = true;
					}
				}
				else
				{
					alert("More than one project with this name exists, this will be added as a new project.");
				}
			}
			
			if(overwrite)
			{
				localStorage.setItem(PROJ_PREFIX+idx.find(e=>e.name === data.name).id, JSON.stringify(data));
			}
			else
			{
				const newId = idx.reduce((m,p) => Math.max(m,p.id), 0) + 1;
				idx.push({id:newId, name:data.name});
				saveIndex(idx);
				localStorage.setItem(PROJ_PREFIX+newId, JSON.stringify(data));
			}
            alert("Project imported successfully.");
			goHome();
        } 
		catch (err) 
		{
            alert("That file isn't a valid project.");
        }
    };

    reader.readAsText(file);
}

function expProject()
{
	if(project === null)
	{
		alert('Error: Unable to export current project!'); 
		return;
	}
	
	const data = JSON.parse(localStorage.getItem(PROJ_PREFIX+project.id))
	
    if (!data) 
	{
        alert("No saved data found.");
        return;
    }

    const blob = new Blob([JSON.stringify(data)], {type: "application/json"});

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = project.name + "_backup.csch";
    a.click();
    URL.revokeObjectURL(url);
}

// ---- Runtime-only daily breakdown (never saved with the project) ----
// projectDayTable is ONE array object that is emptied and refilled in place, so any reference to it stays valid.
// It holds one row per child per day for every month currently in the project, ordered by child, then date.
// It is refreshed whenever computeMonthTotals() runs (that month/child only); createProjectTable() refreshes all of it.
const projectDayTable = [];
const dayDetailStore = {};      // projectId -> childId -> ym -> rows[]
let dayTableSuspended = false;  // true while createProjectTable recalculates everything, so the table is rebuilt once

// 8:00 AM-5:00 PM style label (no "(end of day)" suffix)
function periodTimeLabel(min)
{
	return minutesLabel(min === 1440 ? 0 : min);
}

function storeDayDetails(p, childId, ym, rows)
{
	if(!dayDetailStore[p.id]) dayDetailStore[p.id] = {};
	if(!dayDetailStore[p.id][childId]) dayDetailStore[p.id][childId] = {};
	dayDetailStore[p.id][childId][ym] = rows;
	if(!dayTableSuspended) rebuildProjectDayTable(p);
}

// Refills projectDayTable (same array object) from the store: project children in order, then date. Only months
// currently in the project and children currently in the project are included.
function rebuildProjectDayTable(p)
{
	projectDayTable.length = 0;
	const store = dayDetailStore[p.id] || {};
	const months = p.months.slice().sort();
	p.children.forEach(c => {
		months.forEach(ym => {
			const rows = store[c.id] && store[c.id][ym];
			if(rows) rows.forEach(r => projectDayTable.push(r));
		});
	});
}

// Builds the rows for one child / month. plan is the per-day decision map produced by evaluateBilling().
function buildDayRows(p, childId, ym, allDays, auth, plan)
{
	const child = p.children.find(c => c.id === childId) || {name:'', id:childId};
	const byDate = {};
	allDays.forEach(d => { byDate[d.dateStr] = d; });
	const sched = p.schedule[childId] || {};
	const round2 = x => Math.round(x * 100) / 100;
	const rows = [];
	const dim = daysInMonth(ym);
	for(let day = 1; day <= dim; day++)
	{
		const dateStr = ym + '-' + pad2(day);
		const d = byDate[dateStr];
		const e = plan[dateStr];
		let periods = '';
		if(e)
		{
			const list = (sched[dateStr] || []).filter(x => x.type === e.periodType).map(x => ({start:x.start, end:x.end}));
			periods = mergeIntervals(list).map(x => periodTimeLabel(x.start) + '-' + periodTimeLabel(x.end)).join(', ');
		}
		rows.push({
			'Date': dateStr,
			'Child Name': child.name,
			'Child ID': child.id,
			'Authorized': (auth.days && auth.days[dateStr]) ? 'Yes' : 'No',
			'Scheduled': (d && d.numSched > 0) ? 'Yes' : 'No',
			'Attendance Day': (e && e.isAttendance) ? 'Yes' : 'No',
			'Day Type': e ? e.type : 'None',
			'Periods': periods,
			'Hours': e ? round2(e.hours) : 0,
			'FDU': e ? e.FDU : 0,
			'HDU': e ? e.HDU : 0,
			'OTU': e ? e.OTU : 0,
			'NSH Hours': e ? round2(e.NSH) : 0
		});
	}
	return rows;
}

// Forces every child / every project month to be recalculated (which refreshes projectDayTable) and returns the table.
function createProjectTable(id)
{
	if(!project || (id !== undefined && project.id !== id))
	{
		projectDayTable.length = 0;
		return projectDayTable;
	}
	delete dayDetailStore[project.id];
	dayTableSuspended = true;
	try
	{
		project.children.forEach(c => {
			project.months.slice().sort().forEach(ym => computeMonthTotals(project, c.id, ym));
		});
	}
	finally
	{
		dayTableSuspended = false;
	}
	rebuildProjectDayTable(project);
	return projectDayTable;
}

function expToCSV()
{
	if(project === null)
	{
		alert('Error: Unable to export data from current project!'); 
		return;
	}
	const projectData = createProjectTable(project.id);
    if (projectData.length === 0) 
	{
        alert("Error: The project contains no data!");
        return;
    }
	// Extract headers
    const headers = Object.keys(projectData[0]);
    const csvRows = [];
    // Add header row
    csvRows.push(headers.join(','));
    // Add data rows
    for (const row of projectData) 
	{
        const values = headers.map(header => {
            const escaped = ('' + row[header]).replace(/"/g, '\\"');
            return `"${escaped}"`;});
		
        csvRows.push(values.join(','));
    }
    const csvString = csvRows.join('\n');
    const blob = new Blob([csvString], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.setAttribute('hidden', '');
    a.setAttribute('href', url);
    a.setAttribute('download', project.name + '_data.csv');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);	
}

// Authorization data is built from a list of individual authorizations per child/month.
// Each authorization covers a start-end date range (limited to the viewed month) and specifies
// FDU/HDU/OTU/Hours/NSHB. An authorization may optionally be flagged as a "10 day notice" period,
// in which case it must start on the 1st of the month and end on or before the 10th.
// The monthly authData record (FDU/HDU/OTU/Hours/NSHB + a per-day inclusion map) is a derived sum
// of the authList entries and is only ever recomputed when an authorization is added, edited, or removed.

  // Folds any pre-authList projects' flat authData records into a single equivalent authList entry
  // covering the full month, so existing saved/imported data isn't lost. Safe to call repeatedly.
  function migrateLegacyAuthData(p)
  {
    if(!p.authData) return;
    if(!p.authList) p.authList = {};
    if(!p.nextAuthId) p.nextAuthId = 1;

    Object.keys(p.authData).forEach(childId => {
      const byMonth = p.authData[childId] || {};
      Object.keys(byMonth).forEach(ym => {
        const rec = byMonth[ym];
        if(!rec) return;
        const alreadyHasList = p.authList[childId] && p.authList[childId][ym] && p.authList[childId][ym].length > 0;
        if(alreadyHasList) return; // already migrated / already using the new list
        const hasValues = (rec.FDU || rec.HDU || rec.OTU || rec.Hours || rec.NSHB);
        if(!hasValues) return; // nothing to migrate

        p.authList[childId] = p.authList[childId] || {};
        p.authList[childId][ym] = [{
          id: "a" + (p.nextAuthId++),
          start: ym + "-01",
          end: ym + "-" + pad2(daysInMonth(ym)),
          FDU: rec.FDU || 0,
          HDU: rec.HDU || 0,
          OTU: rec.OTU || 0,
          Hours: rec.Hours || 0,
          NSHB: !!rec.NSHB,
          tenDayNotice: false
        }];
      });
    });

    // Recompute every month we have an authList for, so authData.days maps exist for migrated + existing data
    Object.keys(p.authList).forEach(childId => {
      Object.keys(p.authList[childId]).forEach(ym => recomputeAuthData(p, childId, ym));
    });
  }

  // Recalculates the derived authData record (sums + per-day inclusion map) for a child/month
  // from the current authList entries. Call this any time the authList changes.
  function recomputeAuthData(p, childId, ym)
  {
    const list = (p.authList[childId] && p.authList[childId][ym]) || [];
    const sum = {FDU:0, HDU:0, OTU:0, Hours:0, NSHB:false, days:{}};

    const dim = daysInMonth(ym);
    for(let d=1; d<=dim; d++){ sum.days[ym + "-" + pad2(d)] = false; }

    list.forEach(a => {
      sum.FDU += a.FDU;
      sum.HDU += a.HDU;
      sum.OTU += a.OTU;
      sum.Hours += a.Hours;
      if(a.NSHB) sum.NSHB = true;
      const startDay = parseInt(a.start.slice(8,10), 10);
      const endDay = parseInt(a.end.slice(8,10), 10);
      for(let d=startDay; d<=endDay; d++){ sum.days[ym + "-" + pad2(d)] = true; }
    });

    p.authData = p.authData || {};
    p.authData[childId] = p.authData[childId] || {};
    p.authData[childId][ym] = sum;
  }

  function getAuthData(childId, ym)
  {
    const rec = project.authData && project.authData[childId] && project.authData[childId][ym];
    return rec || {FDU:0, HDU:0, OTU:0, Hours:0, NSHB:false, days:{}};
  }

  function getAuthList(childId, ym)
  {
    return (project.authList[childId] && project.authList[childId][ym]) || [];
  }

  // Validates a proposed authorization's dates/flag against the rules; returns an error string or null if OK.
  function validateAuthorization(ym, start, end, tenDayNotice)
  {
    const monthStart = ym + "-01";
    const monthEnd = ym + "-" + pad2(daysInMonth(ym));
    if(!start || !end) return "Please choose both a start and end date.";
    if(start < monthStart || start > monthEnd || end < monthStart || end > monthEnd)
    {
      return "The authorization's start and end dates must fall within " + monthLabel(ym) + ".";
    }
    if(end < start) return "The end date must be on or after the start date.";
    if(tenDayNotice)
    {
      if(start !== monthStart) return "A 10 day notice authorization must start on the first day of the month.";
      if(parseInt(end.slice(8,10),10) > 10) return "A 10 day notice authorization must end on or before the 10th of the month.";
    }
    return null;
  }

function escapeHtml(s)
{
  return String(s).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function pad2(n)
{
	return String(n).padStart(2,"0"); 
}

function currentMonthStr()
{
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
}

function prevMonthStr(ym)
{
  let [y,m] = ym.split("-").map(Number);
  m -= 1;
  if(m === 0){ m = 12; y -= 1; }
  return `${y}-${pad2(m)}`;
}

function maxSelectableMonth()
{
  return prevMonthStr(currentMonthStr());
}

function generateMonthRange(start, end)
{
  const result = [];
  let [y,m] = start.split("-").map(Number);
  const [ey,em] = end.split("-").map(Number);
  while(y < ey || (y === ey && m <= em)){
    result.push(`${y}-${pad2(m)}`);
    m += 1;
    if(m > 12){ m = 1; y += 1; }
  }
  return result;
}

function daysInMonth(ym)
{
  const [y,m] = ym.split("-").map(Number);
  return new Date(y, m, 0).getDate();
}

function firstWeekday(ym)
{
  const [y,m] = ym.split("-").map(Number);
  return new Date(y, m-1, 1).getDay();
}

function monthLabel(ym)
{
  const [y,m] = ym.split("-").map(Number);
  return `${MONTH_NAMES[m-1]} ${y}`;
}

// Short "Mon D" style label for a YYYY-MM-DD string, used in the authorizations list.
function shortDateLabel(dateStr)
{
  const [y,m,d] = dateStr.split("-").map(Number);
  return `${MONTH_NAMES[m-1].slice(0,3)} ${d}`;
}

function minutesLabel(min)
{
  if(min === 1440) return "12:00 AM (end of day)";
  const h = Math.floor(min/60), mm = min % 60;
  const period = h < 12 ? "AM" : "PM";
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return `${h12}:${pad2(mm)} ${period}`;
}

function shortTime(min)
{
  if(min === 1440) return "12a";
  const h = Math.floor(min/60), mm = min % 60;
  const period = h < 12 ? "a" : "p";
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return mm === 0 ? `${h12}${period}` : `${h12}:${pad2(mm)}${period}`;
}

function timeOptions(selected)
{
  let opts = "";
  for(let min = 0; min <= 1440; min += 1){
    opts += `<option value="${min}" ${min===selected?"selected":""}>${minutesLabel(min)}</option>`;
  }
  return opts;
}

// Merge a list of same-type intervals (touching or overlapping) into the minimal set.
function mergeIntervals(list)
{
  if(list.length === 0) return [];
  const sorted = list.slice().sort((a,b) => a.start - b.start);
  const merged = [{start:sorted[0].start, end:sorted[0].end}];
  for(let i=1;i<sorted.length;i++){
    const last = merged[merged.length-1];
    const cur = sorted[i];
    if(cur.start <= last.end){
      last.end = Math.max(last.end, cur.end);
    } else {
      merged.push({start:cur.start, end:cur.end});
    }
  }
  return merged;
}

// Adds a period for a child/date/type, merging with any touching or overlapping
// period of the SAME type. Periods of different types are left independent.
// A single date can have scheduled types and either: attendance types, single holiday entry, or a single profesional development entry
// If the day has attendance, can have multiple attendances that are discreet (if touching or overlapping, merge)
// If the day has scheduled types, can have multiple scheduled periods that are discreet (if touching or overlapping, merge to one)

function mergeAddPeriod(project, childId, dateStr, type, start, end)
{
	project.schedule[childId] = project.schedule[childId] || {};
	project.schedule[childId][dateStr] = project.schedule[childId][dateStr] || [];
	const periods = project.schedule[childId][dateStr];

	const EXCLUSIVE_TYPES = new Set(["Attended", "Holiday", "ProfDev"]);
	
	const conflicting = periods.filter(p =>
		p.type !== type &&
		EXCLUSIVE_TYPES.has(p.type) &&
		EXCLUSIVE_TYPES.has(type));

	if (conflicting.length > 0)
	{
		alert(`Error: cannot add an entry of type: '${type}' to ${dateStr}, this date already contains an entry of type: '${conflicting[0].type}'.`);
		return;
	}

	const sameType = periods.filter(p => p.type === type);
	const others = periods.filter(p => p.type !== type);
	sameType.push({start, end, type});

	const merged = mergeIntervals(sameType).map(p => ({start:p.start, end:p.end, type}));
	const combined = others.concat(merged).sort((a,b) => a.start - b.start);

	if(combined.length === 0)
	{
		delete project.schedule[childId][dateStr];
	}
	else 
	{
		project.schedule[childId][dateStr] = combined;
	}
}

// 0 = Monday, 6 = Sunday
function getWeekday(dateStr) 
{
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) 
	{
        return -1;
    }
    const date = new Date(dateStr + 'T00:00:00');

    if (isNaN(date.getTime())) 
	{
        return -1;
    }
	let retDay = date.getDay();
    return (retDay === 0?6:retDay-1);
}
function getWeekdayName(dateStr)
{
	let val = getWeekday(dateStr);
	if (val === -1) return null;
	
	return WEEKDAY_NAMES[(getWeekday(dateStr)+1%7)];
}

function isHolidayStr(dateStr)
{
	let myDate = new Date(dateStr+ 'T00:00:00');
	if (isNaN(myDate.getTime())) return false;
	
	return isHoliday(myDate);
}

function isHoliday(date) // determines whether the date is a legal holiday as defined in RCW
{
    const year = date.getFullYear();
    const month = date.getMonth() + 1; // JS months are 0-based
    const day = date.getDate();

    // Returns: su, mo, tu, we, th, fr, sa
    const wkDay = ["su", "mo", "tu", "we", "th", "fr", "sa"][date.getDay()];

    let returnVal = false;

    // Compare dates ignoring time
    const sameDate = (d1, d2) =>
        d1.getFullYear() === d2.getFullYear() &&
        d1.getMonth() === d2.getMonth() &&
        d1.getDate() === d2.getDate();

    const addDays = (d, days) => {
        const result = new Date(d);
        result.setDate(result.getDate() + days);
        return result;
    };

    const firstMonday = (year, month) => {
        let d = new Date(year, month - 1, 1);
        while (d.getDay() !== 1) { // Monday
            d.setDate(d.getDate() + 1);
        }
        return d;
    };

    switch (month) 
    {

        case 1: // New Year's Day and MLK Day
            if (day === 1 || (day === 2 && wkDay === "mo")) {
                returnVal = true;
            } else {
                const mlkDay = addDays(firstMonday(year, 1), 14); // 3rd Monday
                if (sameDate(date, mlkDay)) {
                    returnVal = true;
                }
            }
            break;

        case 2: // Presidents Day
            {
                const presidentsDay = addDays(firstMonday(year, 2), 14); // 3rd Monday
                if (sameDate(date, presidentsDay)) {
                    returnVal = true;
                }
            }
            break;

        case 5: // Memorial Day
            {
                let memorialDay = new Date(year, 4, 31); // May 31
                while (memorialDay.getDay() !== 1) { // Monday
                    memorialDay.setDate(memorialDay.getDate() - 1);
                }
                if (sameDate(date, memorialDay)) {
                    returnVal = true;
                }
            }
            break;

        case 6: // Juneteenth
            if (year > 2021) {
                if (
                    day === 19 ||
                    (day === 18 && wkDay === "fr") ||
                    (day === 20 && wkDay === "mo")
                ) {
                    returnVal = true;
                }
            }
            break;

        case 7: // Independence Day
            if (
                day === 4 ||
                (day === 3 && wkDay === "fr") ||
                (day === 5 && wkDay === "mo")
            ) {
                returnVal = true;
            }
            break;

        case 9: // Labor Day
            {
                const laborDay = firstMonday(year, 9);
                if (sameDate(date, laborDay)) {
                    returnVal = true;
                }
            }
            break;

        case 11: // Veterans Day, Thanksgiving, Friday after
            if (
                day === 11 ||
                (day === 10 && wkDay === "fr") ||
                (day === 12 && wkDay === "mo")
            ) {
                returnVal = true;
            } else {
                let thanksgiving = new Date(year, 10, 1); // Nov 1
                while (thanksgiving.getDay() !== 4) { // Thursday
                    thanksgiving.setDate(thanksgiving.getDate() + 1);
                }
                thanksgiving = addDays(thanksgiving, 21); // 4th Thursday

                if (
                    sameDate(date, thanksgiving) ||
                    sameDate(date, addDays(thanksgiving, 1))
                ) {
                    returnVal = true;
                }
            }
            break;

        case 12: // Christmas and possible New Year's observation
            if (
                day === 25 ||
                (day === 24 && wkDay === "fr") ||
                (day === 26 && wkDay === "mo")
            ) {
                returnVal = true;
            }

            // New Year's Day observed on Dec 31 when Jan 1 is Saturday
            if (day === 31 && wkDay === "fr") {
                returnVal = true;
            }
            break;
    }

    return returnVal;
}

function computeDayTotals(project, childId, dateStr)

  const periods = (project.schedule[childId] && project.schedule[childId][dateStr]) || [];
  periods.forEach(p => {
    const hrs = (p.end - p.start) / 60;
	let nshrs = 0;
    if(p.type === "Scheduled") 
	{
		totals.scheduled += hrs;
		
		// calculate scheduled NSHB, include all hours of attendance
		if ((getWeekday(dateStr) > 4) || (isHolidayStr(dateStr))) // Sat or Sunday or Legal Holiday
		{
			totals.sNSH += hrs;
		}
		else
		{
			let nshrs = 0;
			if (p.start < 360)
			{
				nshrs += ((p.end>360?360:p.end) - p.start)/60;
			}
			if(p.end > 1080)
			{
				nshrs += (p.end - ((p.start<1080?1080:p.start)))/60;
			}
			totals.sNSH += nshrs;
		}
		
	}
    else if(p.type === "Attended")
	{		
		totals.attended += hrs;
		
		// calculate NSHB, include all hours of attendance
		if ((getWeekday(dateStr) > 4) || (isHolidayStr(dateStr))) // Sat or Sunday or Legal Holiday
		{
			totals.NSH += hrs;
		}
		else
		{
			let nshrs = 0;
			if (p.start < 360)
			{
				nshrs += ((p.end>360?360:p.end) - p.start)/60;
			}
			if(p.end > 1080)
			{
				nshrs += (p.end - ((p.start<1080?1080:p.start)))/60;
			}
			totals.NSH += nshrs;
		}
	}
	// TODO: Do holiday/profdev days that would have been NSHB count toward NSHB if the child has attended any NS hours?
    else if(p.type === "Holiday")
	{
		totals.holiday += hrs;
	}
	else if(p.type === "ProfDev") 
	{
		totals.profDev += hrs;
	}

  });
	// Maximum of 16 hours per day can be scheduled or counted as attended (aside from NSH)
	totals.scheduled = Math.min(totals.scheduled,16.0);
	totals.attended = Math.min(totals.attended,16.0);
	
	// calculate daily units based on totals after all periods have been processed
	totals.numAtt = (totals.attended > 0?1:0); 
	totals.numSched = (totals.scheduled > 0?1:0); 
	if(totals.scheduled < 5)
	{
		totals.sHDU = 1;
	}
	else if(totals.scheduled <= 10)
	{
		totals.sFDU = 1;
	}
	else if(totals.scheduled <= 15)
	{
		totals.sFDU = 1;
		totals.sOTU = 1;
	}
	else
	{
		totals.sFDU = 1;
		totals.sdOTU = 1;
	}
	
	if(totals.numAtt === 0 && totals.numSched === 1) // holiday or prof dev only included if it was a scheduled day
	{
		totals.numHoliday = (totals.holiday > 0?1:0);
		if(totals.numHoliday === 0)
		{
			totals.numProfDev = (totals.profDev > 0?1:0);  
		}
	}
	else
	{
		if(totals.attended < 5)
		{
			totals.aHDU = 1;
		}
		else if(totals.attended <= 10)
		{
			totals.aFDU = 1;
		}
		else if(totals.attended <= 15)
		{
			totals.aFDU = 1;
			totals.aOTU = 1;
			totals.otAttended = 1; // They attended at least a day of actual overtime attendance
		}
		else // over 15 hours gets double overtime units
		{
			totals.aFDU = 1;
			totals.adOTU = 1;
			totals.dubOtAttended = 1; // They attended at least a day of actual double overtime attendance
		}
	}
	
	totals.holiday *= totals.numHoliday; 	//  If not counted as a holiday, don't include holiday hours
	totals.profDev *= totals.numProfDev;	// If not counted as prof dev day, don't include prof dev hours
	if(totals.numHoliday)
	{
		if(totals.holiday < 5)
		{
			totals.hHDU = 1;
		}
		else if(totals.holiday <= 10)
		{
			totals.hFDU = 1;
		}
		else if(totals.holiday <= 15)
		{
			totals.hFDU = 1;
			totals.hOTU = 1;
		}
		else
		{
			totals.hFDU = 1;
			totals.hdOTU = 1;
		}
	}
	else if(totals.numProfDev)
	{
		if(totals.profDev < 5)
		{
			totals.pHDU = 1;
		}
		else if(totals.profDev <= 10)
		{
			totals.pFDU = 1;
		}
		else if(totals.profDev <= 15)
		{
			totals.pFDU = 1;
			totals.pOTU = 1;
		}
		else
		{
			totals.pFDU = 1;
			totals.pdOTU = 1;
		}
	}
	  
  return totals;
}

// Allowable billing is dependant on the rules in place at the time
// TODO: Update this, need to determine whether each individual day is included in counts or not, and if so, what count to use for the day if there are multiple types...
// If there is no authorization covereage for the day, can/should anything be counted/included for that day?
// If there is both scheduled attendance and attendance do we use only actual attendance or whichever is more or whichever is least?

function computeMonthTotals(project, childId, ym)
{
  const totals = {scheduled:0, attended:0, otAttended:0, dubOtAttended:0, holiday:0, NSHB:0, sNSH:0, NSH:0, profDev:0, aFDU:0, aHDU:0, aOTU:0, adOTU:0, sFDU:0, sHDU:0, sOTU:0, sdOTU:0,
	hFDU:0, hHDU:0, hOTU:0, hdOTU:0, pFDU:0, pHDU:0, pOTU:0, pdOTU:0, numAtt:0, numHoliday:0, numProfDev:0, numElig:0, numSched:0, maxHrs:0, maxFDU:0, maxHDU:0, maxOTU:0, allAuth:false,
	billableHrs: 0, billableFDU:0, billableHDU:0, billableOTU:0, billableNSHB:false,
	billableDays:0, attDaysCounted:0, absentDaysBilled:0, absentDaysAllowed:0, otAbsentDaysBilled:0, notes:[]};
  const allDays = [];
  const sched = project.schedule[childId] || {};
  Object.keys(sched).forEach(dateStr => {
    if(!dateStr.startsWith(ym)) return;
    const d = computeDayTotals(project, childId, dateStr);
    totals.scheduled += d.scheduled;
    totals.attended += d.attended;
	totals.otAttended += d.otAttended;
	totals.dubOtAttended += d.dubOtAttended;
    totals.holiday += d.holiday;
	totals.profDev += d.profDev;
	totals.NSH += d.NSH;
	totals.sNSH += d.sNSH;
	totals.numAtt += d.numAtt;
	totals.numSched += d.numSched;
	// Attended unit data
	totals.aFDU += d.aFDU;
	totals.aHDU += d.aHDU;
	totals.aOTU += d.aOTU;
	totals.adOTU += d.adOTU;
	//Scheduled unit data
	totals.sFDU += d.sFDU;
	totals.sHDU += d.sHDU;
	totals.sOTU += d.sOTU;
	totals.sdOTU += d.sdOTU;
	// Holiday unit data
	totals.hFDU += d.hFDU;
	totals.hHDU += d.hHDU;
	totals.hOTU += d.hOTU;
	totals.hdOTU += d.hdOTU;
	// ProfDev day unit data
	totals.pFDU += d.pFDU;
	totals.pHDU += d.pHDU;
	totals.pOTU += d.pOTU;
	totals.pdOTU += d.pdOTU;
	
	totals.numHoliday += d.numHoliday;
	totals.numProfDev += d.numProfDev;
	
	allDays.push({ dateStr:dateStr, ...d});
  });
  
	totals.NSH = Math.min(totals.NSH, totals.sNSH); // Will only be eligible for NSHB if schedule meets requirements also
  
	// IMPORTANT: if NSHB requirements change it will need to be addressed here and determined by ym
	if(totals.NSH >= NSHB_MIN_HOURS) { totals.NSHB = 1; }
	
	// thisAuth.days is a per-day inclusion map (dateStr -> true/false) derived from the child's
	// authorizations for this month (see recomputeAuthData). Business-rule functions below can use
	// it to include/exclude specific dates once the authorization caps are wired in.
	const thisAuth = project?.authData?.[childId]?.[ym] ??
	{
		FDU: 0,
		HDU: 0,
		OTU: 0,
		Hours: 0,
		NSHB: false,
		days: {},
	};
  
	// Derived (not saved) context for the rule functions: the authorization periods (for ten day notice / per-period
	// attendance) and holidays / prof dev days already used earlier in the year.
	const authCtx = Object.assign({}, thisAuth, {
		periods: (((project.authList || {})[childId] || {})[ym] || []).map(a => ({start: a.start, end: a.end, tenDay: !!a.tenDayNotice})),
		holidaysUsedBefore: 0,
		profDevUsedBefore: 0
	});
	const usedBefore = closureUsageBefore(project, childId, ym);
	authCtx.holidaysUsedBefore = usedBefore.holidays;
	authCtx.profDevUsedBefore = usedBefore.profDev;

    // Calculate monthly data once all days are processed
	// IMPORTANT: This will need to be updated any time buisness rules change
	// new functions may need to be added if rules change, otherwise select the appropriate logic function available
	if(ym < '2013-07')  { priorJuly2013(totals, allDays, authCtx); }
	else if(ym < '2026-10')  { july2013Rules(totals, allDays, authCtx); }
	// add else ifs here as new rules change
	else { oct2026Rules(totals, allDays, authCtx); }	// current rules

	// Refresh the runtime-only daily breakdown for this child / month
	storeDayDetails(project, childId, ym, buildDayRows(project, childId, ym, allDays, thisAuth, totals.dayPlan || {}));
	delete totals.dayPlan;
  
  return totals;
}

// !! Business rules functions start here...
// Every rule function receives (totals, allDays, ctx) and sets, at minimum: maxHrs, maxFDU, maxHDU, maxOTU, allAuth
// plus the authorization-limited billable values. Nothing here is persisted: all of it is derived from the
// schedule + authList/authData that are saved.
//
// ctx = the saved authData record for the child/month (FDU, HDU, OTU, Hours, NSHB, days) plus derived, NON-saved fields:
//   ctx.periods              [{start, end, tenDay}] built from project.authList
//   ctx.holidaysUsedBefore   holidays already counted earlier in the same year
//   ctx.profDevUsedBefore    professional days already counted earlier in the same year

const NSHB_MIN_HOURS = 30;  // hours of non-standard care needed for NSHB
// replace this with a function NSHB_MIN_HOURS(ym) That returns NSHB based on the month? To be updated if NSHB ever changes to handle requirements in different Months
// NSHB requirement was 40 hours prior to 2024???
const HOLIDAYS_PER_YEAR = 11;
const PROFDEV_PER_YEAR = 5;
// replace all these with functions that return the number based on the ym?
const COUNT_UNSCHEDULED_ATTENDANCE = true; // true: a day attended with no scheduled care is an attendance day billed on attended hours
function closureYearKey(ym) { return ym.slice(0, 4); } // holiday/prof dev allowances reset by calendar year; change here if the year differs

// A day of real attendance that counts toward attendance rules
function isRealAttDay(d) { return d.numAtt > 0 && (COUNT_UNSCHEDULED_ATTENDANCE || d.numSched > 0); }

// computeDayTotals() output for every day in the month that is covered by an authorization
function authorizedDayList(project, childId, ym)
{
	const covered = (project.authData && project.authData[childId] && project.authData[childId][ym] && project.authData[childId][ym].days) || {};
	const sched = project.schedule[childId] || {};
	const out = [];
	Object.keys(sched).forEach(dateStr => {
		if(!dateStr.startsWith(ym) || !covered[dateStr]) return;
		out.push({ dateStr: dateStr, ...computeDayTotals(project, childId, dateStr) });
	});
	return out;
}

// Which holiday / prof dev days count as attendance. They only count if the month has at least one day of real
// attendance, the day was scheduled care (numHoliday/numProfDev already require that), and the yearly maximums allow.
// Days are used in date order.
function pickClosureDays(days, usedHolidays, usedProfDev)
{
	const res = { holidays: [], profDev: [] };
	if(!days.some(isRealAttDay)) return res;
	days.slice().sort((a, b) => a.dateStr.localeCompare(b.dateStr)).forEach(d => {
		if(d.numHoliday > 0)
		{
			if(usedHolidays + res.holidays.length < HOLIDAYS_PER_YEAR) res.holidays.push(d.dateStr);
		}
		else if(d.numProfDev > 0)
		{
			if(usedProfDev + res.profDev.length < PROFDEV_PER_YEAR) res.profDev.push(d.dateStr);
		}
	});
	return res;
}

// Holidays / prof dev days already counted in earlier months of the same year
function closureUsageBefore(project, childId, ym)
{
	const year = closureYearKey(ym);
	const sched = project.schedule[childId] || {};
	const months = [...new Set(Object.keys(sched).map(ds => ds.slice(0, 7)))]
		.filter(m => closureYearKey(m) === year && m < ym).sort();
	let h = 0, p = 0;
	months.forEach(m => {
		const r = pickClosureDays(authorizedDayList(project, childId, m), h, p);
		h += r.holidays.length;
		p += r.profDev.length;
	});
	return { holidays: h, profDev: p };
}

// Tier rule (Oct 2026+): total days of care billable for a given number of attendance days
// update this to use ym also so that it can be changed easily in the future?
function tierTotalDays(n)
{
	if(n <= 0) return 0;
	if(n <= 7) return 11;
	if(n <= 15) return 15;
	return Infinity;
}

// Absent-day selection for one "pool" of care (regular care, or overtime care).
//   attend: days already counted as attendance        cands: scheduled days with no attendance
//   gate(d): may this day be billed as an absent day (pre-Oct 2026 attendance / ten day notice requirement)
//   rank(d): sort value, highest first
function applyAbsentRules(era, attend, cands, gate, rank)
{
	const sorted = cands.slice().sort((a, b) => rank(b) - rank(a) || a.dateStr.localeCompare(b.dateStr));
	let eligible = [], allowed = 0;
	if(era === 'pre2013')      { eligible = sorted.filter(gate); allowed = 5; }
	else if(era === 'jul2013') { eligible = sorted.filter(gate); allowed = Infinity; }
	else // oct2026. 0 attendance days = nothing billable, even with a ten day notice
	{
		const total = tierTotalDays(attend.length);
		if(attend.length === 0) return { attend: [], absent: [], allowed: 0 };
		eligible = sorted;
		allowed = (total === Infinity) ? Infinity : Math.max(0, total - attend.length);
	}
	return { attend: attend, absent: eligible.slice(0, allowed === Infinity ? eligible.length : allowed), allowed: allowed };
}

// Shared engine for all eras. era = 'pre2013' | 'jul2013' | 'oct2026'
function evaluateBilling(era, totals, allDays, ctx)
{
	const notes = [];
	// Only days covered by an authorization are used
	const authDays = allDays.filter(d => ctx.days && ctx.days[d.dateStr]);
	if(authDays.length === 0) notes.push('No scheduled days are covered by an authorization.');

	const closure = pickClosureDays(authDays, ctx.holidaysUsedBefore || 0, ctx.profDevUsedBefore || 0);
	const closureSet = new Set(closure.holidays.concat(closure.profDev));

	// Pre-Oct 2026: absent days require attendance within the authorization period, unless it is a ten day notice
	// authorization. Falls back to month-wide attendance if no period info is available.
	const periods = ctx.periods || [];
	const periodHasAtt = periods.map(p => authDays.some(d => isRealAttDay(d) && d.dateStr >= p.start && d.dateStr <= p.end));
	const gate = (d) => {
		if(periods.length === 0) return authDays.some(isRealAttDay);
		return periods.some((p, i) => d.dateStr >= p.start && d.dateStr <= p.end && (p.tenDay || periodHasAtt[i]));
	};

	// ---- Regular care pool (FDU / HDU / hours) ----
	const attendDays = authDays.filter(d => isRealAttDay(d) || closureSet.has(d.dateStr));
	const attendSet = new Set(attendDays.map(d => d.dateStr));
	const regCands = authDays.filter(d => d.numSched > 0 && !attendSet.has(d.dateStr));
	const reg = applyAbsentRules(era, attendDays, regCands, gate, d => d.scheduled);

	let maxFDU = 0, maxHDU = 0, maxHrs = 0;
	reg.attend.forEach(d => {
		// Billed on attended or scheduled time, whichever is more
		if(isRealAttDay(d) && d.attended >= d.scheduled) { maxFDU += d.aFDU; maxHDU += d.aHDU; maxHrs += d.attended; }
		else { maxFDU += d.sFDU; maxHDU += d.sHDU; maxHrs += d.scheduled; }
	});
	reg.absent.forEach(d => { maxFDU += d.sFDU; maxHDU += d.sHDU; maxHrs += d.scheduled; });

	// ---- Overtime pool (OTU). Same rules, grouped and tiered separately from regular care ----
	// A double overtime day is worth 2 OT units (but still only one day of OT attendance when counting attendance days)
	const attOT = d => (d.numAtt > 0 ? d.aOTU + 2 * d.adOTU : 0);
	const schOT = d => (d.numSched > 0 ? d.sOTU + 2 * d.sdOTU : 0);
	const realOtDays = authDays.filter(d => isRealAttDay(d) && attOT(d) > 0);
	let otAttend = realOtDays.slice();
	// Holiday / prof dev days with scheduled OT count as OT attendance (Oct 2026: only if there was real OT attendance)
	const closureOtDays = authDays.filter(d => closureSet.has(d.dateStr) && schOT(d) > 0);
	if(era !== 'oct2026' || realOtDays.length > 0) otAttend = otAttend.concat(closureOtDays);
	const otSet = new Set(otAttend.map(d => d.dateStr));
	const otCands = authDays.filter(d => schOT(d) > 0 && !otSet.has(d.dateStr));
	const ot = applyAbsentRules(era, otAttend, otCands, gate, d => d.scheduled);

	let maxOTU = 0;
	ot.attend.forEach(d => { maxOTU += Math.max(attOT(d), schOT(d)); });
	ot.absent.forEach(d => { maxOTU += schOT(d); });

	// ---- NSHB: only within authorized days, only when the hours are actually met ----
	// Only hours on days that are actually eligible (attendance / counted holiday / prof dev / valid absent) count.
	let nshAtt = 0, nshSched = 0;
	reg.attend.concat(reg.absent).forEach(d => { nshAtt += d.NSH; nshSched += d.sNSH; });
	const nshbEligible = Math.min(nshAtt, nshSched) >= NSHB_MIN_HOURS;

	// ---- Per-day decisions (runtime only), used to build the daily breakdown table ----
	const plan = {};
	const holSet = new Set(closure.holidays), pdSet = new Set(closure.profDev);
	reg.attend.forEach(d => {
		// Billed on attended or scheduled time, whichever is more (same as the unit totals above)
		const useAtt = isRealAttDay(d) && d.attended >= d.scheduled;
		plan[d.dateStr] = {
			type: holSet.has(d.dateStr) ? 'Holiday' : (pdSet.has(d.dateStr) ? 'ProfDev' : 'Attended'),
			isAttendance: true, periodType: useAtt ? 'Attended' : 'Scheduled',
			hours: useAtt ? d.attended : d.scheduled,
			FDU: useAtt ? d.aFDU : d.sFDU, HDU: useAtt ? d.aHDU : d.sHDU, OTU: 0,
			NSH: useAtt ? d.NSH : d.sNSH
		};
	});
	reg.absent.forEach(d => {
		plan[d.dateStr] = { type: 'Absent', isAttendance: false, periodType: 'Scheduled', hours: d.scheduled, FDU: d.sFDU, HDU: d.sHDU, OTU: 0, NSH: d.sNSH };
	});
	const addOT = (d, units) => {
		if(!plan[d.dateStr]) plan[d.dateStr] = { type: 'Absent', isAttendance: false, periodType: 'Scheduled', hours: 0, FDU: 0, HDU: 0, OTU: 0, NSH: 0 };
		plan[d.dateStr].OTU += units;
	};
	ot.attend.forEach(d => addOT(d, Math.max(attOT(d), schOT(d))));
	ot.absent.forEach(d => addOT(d, schOT(d)));
	totals.dayPlan = plan;

	// ---- Report ----
	const billedDates = new Set(reg.attend.concat(reg.absent).map(d => d.dateStr));
	totals.numHoliday = closure.holidays.length;
	totals.numProfDev = closure.profDev.length;
	totals.holiday = authDays.filter(d => closure.holidays.includes(d.dateStr)).reduce((s, d) => s + d.holiday, 0);
	totals.profDev = authDays.filter(d => closure.profDev.includes(d.dateStr)).reduce((s, d) => s + d.profDev, 0);
	totals.numElig = reg.attend.length + reg.absent.length;
	totals.attDaysCounted = reg.attend.length;           // attended + counted holiday/prof dev days
	totals.absentDaysBilled = reg.absent.length;
	totals.absentDaysAllowed = reg.allowed;             // may be Infinity
	totals.otAbsentDaysBilled = ot.absent.length;
	totals.maxHrs = maxHrs; totals.maxFDU = maxFDU; totals.maxHDU = maxHDU; totals.maxOTU = maxOTU;
	totals.allAuth = totals.numElig > 0 &&
		authDays.filter(d => d.numSched > 0).every(d => billedDates.has(d.dateStr)) &&
		authDays.filter(d => schOT(d) > 0).every(d => ot.attend.concat(ot.absent).some(x => x.dateStr === d.dateStr));

	// Always limited by what is authorized
	totals.billableHrs = Math.min(maxHrs, ctx.Hours || 0);
	totals.billableFDU = Math.min(maxFDU, ctx.FDU || 0);
	
	if (totals.billableFDU < maxFDU) // convert remaining to HDU
	{
			maxHDU = (maxHDU + ((maxFDU - totals.billableFDU)*2));
	}
	totals.billableHDU = Math.min(maxHDU, ctx.HDU || 0);
	// convert any remaining HDU to FDU if available
	if (((ctx.FDU || 0) > totals.billableFDU) && (ctx.HDU || 0 > totals.billableHDU))
	{
		totals.billableFDU = Math.min((ctx.FDU || 0), totals.billableFDU + Math.ceil(((ctx.HDU || 0.0)-totals.billableHDU)/2.0))
	}
	
	totals.billableOTU = Math.min(maxOTU, ctx.OTU || 0);
	totals.billableNSHB = !!(nshbEligible && ctx.NSHB && totals.numElig > 0);
	totals.billableDays = totals.numElig;
	totals.notes = notes;
}

// Prior to July 2013: up to 5 absent days (the 5 highest scheduled days with no attendance) on top of attendance days.
// Needs at least one day of attendance in the authorization period unless it is a ten day notice authorization.
function priorJuly2013(totals, allDays, thisAuth) { evaluateBilling('pre2013', totals, allDays, thisAuth); }

// July 2013 - Sep 2026: every scheduled day is billable (unlimited absent days) with the same attendance /
// ten day notice requirement. Limited by authorization.
function july2013Rules(totals, allDays, thisAuth) { evaluateBilling('jul2013', totals, allDays, thisAuth); }

/* 10/1/26 rules: no attendance days = nothing billable (even with a ten day notice). Holiday / prof dev days count as
   attendance (11 / 5 per year) once there is one real day of attendance. 1-7 attendance days = 11 days of care total,
   8-15 = 15 days total, 16+ = all scheduled care. Absent days = tier total - attendance days, taken from the highest
   scheduled days with no attendance. Each day is billed on attended or scheduled time, whichever is more.
   Overtime units are grouped and tiered on their own. Always limited by authorization. */
function oct2026Rules(totals, allDays, thisAuth) { evaluateBilling('oct2026', totals, allDays, thisAuth); }

/* =====================================================================
   KinderConnect attendance CSV import
   Entry point:  importAttendanceCsv()   (wire to a button's onclick)
   ===================================================================== */

const KC_IMPORT = {
  TYPE_ATTENDED:  "Attended",
  TYPE_SCHEDULED: "Scheduled", 
  TYPE_HOLIDAY:   "Holiday",
  // Converts minutes-since-midnight to whatever unit se-start / se-end use.
  toUnits: minutes => minutes
};

/* ---------------------------- CSV parsing ----------------------------- */
function kcParseCsv(text)
{
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);       // strip BOM
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i = 0; i < text.length; i++)
  {
    const ch = text[i];
    if(inQuotes)
    {
      if(ch === '"')
      {
        if(text[i + 1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      }
      else field += ch;
    }
    else if(ch === '"') inQuotes = true;
    else if(ch === ",") { row.push(field); field = ""; }
    else if(ch === "\n" || ch === "\r")
    {
      if(ch === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      rows.push(row); row = [];
    }
    else field += ch;
  }
  if(field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function kcTimeToMinutes(s)
{
  const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec((s || "").trim());
  if(!m) return null;
  let h = parseInt(m[1], 10);
  const min = parseInt(m[2], 10);
  const ap = (m[3] || "").toUpperCase();
  if(min > 59) return null;
  if(ap){ if(h < 1 || h > 12) return null; if(ap === "AM" && h === 12) h = 0; else if(ap === "PM" && h !== 12) h += 12; }
  else if(h > 23) return null;
  return h * 60 + min;
}

function kcDateToIso(s)
{
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((s || "").trim());
  if(!m) return null;
  const mo = +m[1], d = +m[2], y = +m[3];
  const dt = new Date(y, mo - 1, d);
  if(dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}

/* ------------------------------ cleaning ------------------------------ */
/* Only the first 9 columns are used (by position). The report repeats its
   header and data in several blocks, and later blocks drop the Note column
   which shifts the trailing columns, so everything after Absent is ignored. */
function kcCleanRecords(rows)
{
  const stats = { rawRows: rows.length, blankRows: 0, headerRows: 0, junkRows: 0,
                  duplicates: 0, conflicts: [], invalid: [] };
  const seen = new Map();
  for(const r of rows)
  {
    if(!r.some(c => (c || "").trim() !== "")){ stats.blankRows++; continue; }
    if(/^familyname/i.test((r[0] || "").trim())){ stats.headerRows++; continue; }

    const c = r.map(x => (x || "").trim());
    const [family, child, dateRaw, reason, tin, , tout, , absentFlag] = c;
    const date = kcDateToIso(dateRaw);
    if(!child || !date){ stats.junkRows++; continue; }            // totals/footers etc.

    const who = child + " " + date;
    const rl = (reason || "").toLowerCase();
    let status = null, start = null, end = null;

    if(rl === "present" || (rl === "" && tin && tout))
    {
      start = kcTimeToMinutes(tin); end = kcTimeToMinutes(tout);
      if(start === null || end === null){ stats.invalid.push(who + ": missing or unreadable time in/out"); continue; }
      if(end <= start){ stats.invalid.push(who + ": time out is not after time in"); continue; }
      status = "attended";
    }
    else if(rl === "absent" || (rl === "" && absentFlag === "1")) status = "absent";
    else if(rl === "holiday") status = "holiday";
    else { stats.invalid.push(who + ": unrecognized attendance reason '" + reason + "'"); continue; }

    const key = family + "|" + child + "|" + date;
    const sig = status + "|" + start + "|" + end;
    if(seen.has(key))
    {
      if(seen.get(key).sig === sig) stats.duplicates++;
      else { stats.conflicts.push(who + ": conflicting rows in file, first one kept"); }
      continue;
    }
    seen.set(key, { sig, rec: { family, child, date, status, start, end } });
  }
  const records = [...seen.values()].map(v => v.rec);
  return { records, stats };
}

function kcGroupChildren(records)
{
  const map = new Map();
  for(const r of records)
  {
    const key = r.family + "|" + r.child;
    if(!map.has(key)) map.set(key, { key, family: r.family, name: r.child, records: [] });
    map.get(key).records.push(r);
  }
  map.forEach(g => g.records.sort((a, b) => a.date.localeCompare(b.date)));
  return [...map.values()];
}

/* ------------------------------ UI helpers ---------------------------- */
function kcEl(tag, attrs, ...kids)
{
  const e = document.createElement(tag);
  for(const k in (attrs || {}))
  {
    if(k === "style") e.style.cssText = attrs[k];
    else if(k in e) e[k] = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(x => e.appendChild(typeof x === "string" ? document.createTextNode(x) : x));
  return e;
}

function kcInjectStyles()
{
  if(document.getElementById("kc-styles")) return;
  const s = document.createElement("style");
  s.id = "kc-styles";
  s.textContent = `
  .kc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;display:flex;align-items:center;justify-content:center}
  .kc-box{background:#fff;color:#222;border-radius:8px;padding:16px 20px;max-width:760px;width:92%;max-height:88vh;overflow:auto;font:14px/1.4 sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .kc-box h3{margin:0 0 10px}
  .kc-err{color:#b00020;min-height:1.2em;margin:8px 0}
  .kc-bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
  .kc-box button{padding:6px 12px;cursor:pointer}
  .kc-primary{font-weight:bold}
  .kc-box table{border-collapse:collapse;width:100%}
  .kc-box td,.kc-box th{padding:3px 6px;text-align:left;border-bottom:1px solid #ddd}
  .kc-opt{display:block;margin:10px 0 2px}

  .kc-sub input,.kc-sub select{margin-right:8px}
  .kc-scroll{max-height:45vh;overflow:auto;border:1px solid #ddd}
  .kc-muted{color:#666}`;
  document.head.appendChild(s);
}

/* Resolves {id, data}. Buttons with validate:true are blocked until validate() returns null. */
function kcDialog({ title, body, buttons, collect, validate })
{
  kcInjectStyles();
  return new Promise(resolve =>
  {
    const err = kcEl("div", { className: "kc-err" });
    const bar = kcEl("div", { className: "kc-bar" });
    const overlay = kcEl("div", { className: "kc-overlay" },
      kcEl("div", { className: "kc-box" }, kcEl("h3", {}, title), body, err, bar));
    buttons.forEach(b =>
    {
      const btn = kcEl("button", { type: "button", className: b.primary ? "kc-primary" : "" }, b.label);
      btn.onclick = () =>
      {
        if(b.validate && validate){ const msg = validate(); if(msg){ err.textContent = msg; return; } }
        const data = collect ? collect() : null;
        overlay.remove();
        resolve({ id: b.id, data });
      };
      bar.appendChild(btn);
    });
    document.body.appendChild(overlay);
  });
}

function kcNormName(n)
{
  return (n || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean).sort().join(" ");
}
function kcMinToInput(m){ return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
function kcInputToMin(v){ const m = /^(\d{2}):(\d{2})/.exec(v || ""); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function kcNiceDate(iso)
{
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}
function kcMostCommon(arr)
{
  const c = new Map(); arr.forEach(v => c.set(v, (c.get(v) || 0) + 1));
  let best = null, n = 0; c.forEach((k, v) => { if(k > n){ best = v; n = k; } });
  return best;
}

/* ------------------------- project-state helpers ---------------------- */
function kcPeriods(childId, date){ return ((project.schedule || {})[childId] || {})[date] || []; }
function kcHasType(childId, date, type){ return kcPeriods(childId, date).some(p => p.type === type); }
function kcHasPeriod(childId, date, type, s, e){ return kcPeriods(childId, date).some(p => p.type === type && p.start <= s && p.end >= e); }

/* Calls mergeAddPeriod, capturing the alert() it raises on a rule violation. */
function kcAdd(childId, date, type, startMin, endMin, report, label)
{
  const s = KC_IMPORT.toUnits(startMin), e = KC_IMPORT.toUnits(endMin);
  if(kcHasPeriod(childId, date, type, s, e)){ report.duplicate++; return "duplicate"; }
  const msgs = [];
  const origAlert = window.alert;
  window.alert = m => msgs.push(String(m));
  try { mergeAddPeriod(project, childId, date, type, s, e); }
  catch(ex){ msgs.push(ex.message); }
  finally { window.alert = origAlert; }
  if(msgs.length){ report.rejected.push(label + " " + date + " (" + type + "): " + msgs.join(" ")); return "rejected"; }
  return "added";
}

/* ------------------------------- dialogs ------------------------------ */
async function kcMonthsDialog(missing)
{
  const maxMonth = maxSelectableMonth();
  const boxes = [];
  const list = kcEl("div", {});
  missing.forEach(mo =>
  {
    const ok = mo <= maxMonth;
    const cb = kcEl("input", { type: "checkbox", checked: ok, disabled: !ok, value: mo });
    boxes.push(cb);
    list.appendChild(kcEl("label", { className: "kc-opt" }, cb, " " + mo + (ok ? "" : "  (not a fully completed month, cannot be added)")));
  });
  const body = kcEl("div", {}, kcEl("p", {}, "The file contains records for months that are not in this project. Select the months to add. Records in months that are not added will be skipped."), list);
  const r = await kcDialog({
    title: "Months to add", body,
    buttons: [{ id: "cancel", label: "Cancel import" }, { id: "ok", label: "Continue", primary: true }],
    collect: () => boxes.filter(b => b.checked).map(b => b.value)
  });
  return r.id === "ok" ? r.data : null;
}

/* Returns {action:'match'|'new'|'skip'|'skipFamily'|'cancel', id, name} */
async function kcChildDialog(group, pendingIds)
{
  const dates = group.records.map(r => r.date);
  const existing = project.children;
  const norm = kcNormName(group.name);
  const auto = existing.find(c => kcNormName(c.name) === norm);

  const rMatch = kcEl("input", { type: "radio", name: "kcmode", value: "match", disabled: existing.length === 0 });
  const rNew = kcEl("input", { type: "radio", name: "kcmode", value: "new" });
  const sel = kcEl("select", {}, existing.map(c => kcEl("option", { value: c.id, selected: !!auto && c.id === auto.id }, c.name + " (ID " + c.id + ")")));
  const nameIn = kcEl("input", { type: "text", value: group.name, size: 28 });
  const idIn = kcEl("input", { type: "text", size: 12 });
  if(auto) rMatch.checked = true; else rNew.checked = true;

  const body = kcEl("div", {},
    kcEl("p", {}, kcEl("b", {}, group.name), "  (family: " + (group.family || "n/a") + ")"),
    kcEl("p", { className: "kc-muted" }, group.records.length + " records, " + dates[0] + " to " + dates[dates.length - 1] +
      (auto ? ". Suggested match: name equals an existing child." : "")),
    kcEl("label", { className: "kc-opt" }, rMatch, " Match to an existing child"),
    kcEl("div", { className: "kc-sub" }, sel),
    kcEl("label", { className: "kc-opt" }, rNew, " Add as a new child"),
    kcEl("div", { className: "kc-sub" }, "Name: ", nameIn, "Client ID: ", idIn));

  const r = await kcDialog({
    title: "Child in file", body,
    validate: () =>
    {
      if(rMatch.checked) return sel.value ? null : "Choose an existing child.";
      const n = nameIn.value.trim(), id = idIn.value.trim();
      if(!n) return "Please enter a name.";
      if(id === "") return "Please enter a numeric ID.";
      if(existing.some(c => c.id === id) || pendingIds.has(id)) return "That ID is already used by another child in this project.";
      return null;
    },
    buttons: [
      { id: "cancel", label: "Cancel import" },
      { id: "skipFamily", label: "Skip whole family" },
      { id: "skip", label: "Skip this child" },
      { id: "ok", label: "Continue", primary: true, validate: true }
    ],
    collect: () => rMatch.checked
      ? { action: "match", id: sel.value }
      : { action: "new", id: idIn.value.trim(), name: nameIn.value.trim() }
  });
  if(r.id === "ok") return r.data;
  return { action: r.id };
}

/* items: [{date, kind:'absent'|'holiday'}]  ->  [{date, kind, start, end}] or null (cancel) */
async function kcExceptionsDialog(childName, items, defStart, defEnd)
{
  const rows = items.map(it =>
  {
    const cb = kcEl("input", { type: "checkbox", checked: true });
    const st = kcEl("input", { type: "time", value: kcMinToInput(defStart) });
    const en = kcEl("input", { type: "time", value: kcMinToInput(defEnd) });
    return { it, cb, st, en, tr: kcEl("tr", {},
      kcEl("td", {}, cb), kcEl("td", {}, kcNiceDate(it.date)),
      kcEl("td", {}, it.kind === "absent" ? "Absent: add Scheduled" : "Holiday: add Scheduled + Holiday"),
      kcEl("td", {}, st), kcEl("td", {}, en)) };
  });
  const allSt = kcEl("input", { type: "time", value: kcMinToInput(defStart) });
  const allEn = kcEl("input", { type: "time", value: kcMinToInput(defEnd) });
  const applyBtn = kcEl("button", { type: "button" }, "Apply to all rows");
  applyBtn.onclick = () => rows.forEach(r => { r.st.value = allSt.value; r.en.value = allEn.value; });
  const toggle = kcEl("button", { type: "button" }, "Toggle all checks");
  toggle.onclick = () => { const v = !rows.every(r => r.cb.checked); rows.forEach(r => r.cb.checked = v); };

  const body = kcEl("div", {},
    kcEl("p", {}, kcEl("b", {}, childName), ": days marked absent or holiday in the file. Checked rows are added using the times shown " +
      "(defaults are this child's most common attended times). Unchecked rows are skipped."),
    kcEl("p", {}, "Start ", allSt, " End ", allEn, " ", applyBtn, " ", toggle),
    kcEl("div", { className: "kc-scroll" }, kcEl("table", {},
      kcEl("tr", {}, kcEl("th", {}, ""), kcEl("th", {}, "Date"), kcEl("th", {}, "Action"), kcEl("th", {}, "Start"), kcEl("th", {}, "End")),
      rows.map(r => r.tr))));

  const r = await kcDialog({
    title: "Absent and holiday days", body,
    validate: () =>
    {
      for(const x of rows)
      {
        if(!x.cb.checked) continue;
        const s = kcInputToMin(x.st.value), e = kcInputToMin(x.en.value);
        if(s === null || e === null) return "Enter a start and end time for " + x.it.date + ".";
        if(e <= s) return "The end time must be after the start time (" + x.it.date + ").";
      }
      return null;
    },
    buttons: [
      { id: "cancel", label: "Cancel import" },
      { id: "skip", label: "Skip all of these" },
      { id: "ok", label: "Add checked rows", primary: true, validate: true }
    ],
    collect: () => rows.filter(x => x.cb.checked).map(x => ({ date: x.it.date, kind: x.it.kind, start: kcInputToMin(x.st.value), end: kcInputToMin(x.en.value) }))
  });
  if(r.id === "cancel") return null;
  return r.id === "skip" ? [] : r.data;
}

function kcInfoDialog(title, lines, detail)
{
  const body = kcEl("div", {}, lines.map(l => kcEl("p", {}, l)));
  if(detail && detail.length)
    body.appendChild(kcEl("div", { className: "kc-scroll", style: "padding:6px" }, detail.slice(0, 200).map(d => kcEl("div", {}, d)),
      detail.length > 200 ? kcEl("div", { className: "kc-muted" }, "... and " + (detail.length - 200) + " more") : ""));
  return kcDialog({ title, body, buttons: [{ id: "ok", label: "OK", primary: true }] });
}

/* ------------------------------- main flow ---------------------------- */
function importAttendanceCsv()
{
  const input = kcEl("input", { type: "file", accept: ".csv,text/csv" });
  input.onchange = () =>
  {
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => kcRunImport(String(reader.result), file.name).catch(e =>
    { console.error(e); alert("The import failed and nothing was added: " + e.message); });
    reader.onerror = () => alert("Could not read that file.");
    reader.readAsText(file);
  };
  input.click();
}

async function kcRunImport(text, fileName)
{
  /* 1. parse + clean */
  const { records, stats } = kcCleanRecords(kcParseCsv(text));
  if(records.length === 0)
  {
    await kcInfoDialog("Nothing to import", ["No attendance records were recognized in " + fileName + ". Expected KinderConnect columns: FamilyName, ChildName, AttendanceDate, AttendanceReason, TimeIn, ..."], stats.invalid);
    return;
  }

  /* 2. months */
  const allMonths = [...new Set(records.map(r => r.date.slice(0, 7)))].sort();
  const missing = allMonths.filter(m => !project.months.includes(m));
  let monthsToAdd = [];
  if(missing.length)
  {
    const chosen = await kcMonthsDialog(missing);
    if(chosen === null) return;
    monthsToAdd = chosen;
  }
  const allowed = new Set(project.months.concat(monthsToAdd));
  const skippedMonth = records.filter(r => !allowed.has(r.date.slice(0, 7))).length;

  /* 3. children */
  const groups = kcGroupChildren(records.filter(r => allowed.has(r.date.slice(0, 7))));
  const plan = [];                         // {group, childId, isNew, name}
  const skippedFamilies = new Set();
  const pendingIds = new Set();
  let skippedChildRecords = 0;
  for(const g of groups)
  {
    if(skippedFamilies.has(g.family)){ skippedChildRecords += g.records.length; continue; }
    const d = await kcChildDialog(g, pendingIds);
    if(d.action === "cancel") return;
    if(d.action === "skipFamily"){ skippedFamilies.add(g.family); skippedChildRecords += g.records.length; continue; }
    if(d.action === "skip"){ skippedChildRecords += g.records.length; continue; }
    if(d.action === "new") pendingIds.add(d.id);
    plan.push({ group: g, childId: d.id, isNew: d.action === "new", name: d.name });
  }

  /* 4. absent / holiday decisions */
  const report = { months: 0, children: 0, attended: 0, scheduled: 0, holiday: 0, duplicate: 0,
                   rejected: [], skippedMonth, skippedChildRecords, skippedExceptions: 0 };
  const exceptionPlan = [];                // {childId, label, entries[]}
  for(const p of plan)
  {
    const label = p.isNew ? p.name : (project.children.find(c => c.id === p.childId) || {}).name || p.childId;
    p.label = label;
    const items = [];
    for(const r of p.group.records)
    {
      if(r.status === "absent")
      {
        if(p.isNew || !kcHasType(p.childId, r.date, KC_IMPORT.TYPE_SCHEDULED)) items.push({ date: r.date, kind: "absent" });
        else report.duplicate++;
      }
      else if(r.status === "holiday")
      {
        if(p.isNew || !kcHasType(p.childId, r.date, KC_IMPORT.TYPE_HOLIDAY)) items.push({ date: r.date, kind: "holiday" });
        else report.duplicate++;
      }
    }
    if(!items.length) continue;
    const att = p.group.records.filter(r => r.status === "attended");
    const defStart = att.length ? kcMostCommon(att.map(r => r.start)) : 7 * 60;
    const defEnd = att.length ? kcMostCommon(att.map(r => r.end)) : 15 * 60;
    const entries = await kcExceptionsDialog(label, items, defStart, defEnd);
    if(entries === null) return;
    report.skippedExceptions += items.length - entries.length;
    exceptionPlan.push({ childId: p.childId, label, entries });
  }

  /* 5. final confirmation */
  const attendedCount = plan.reduce((n, p) => n + p.group.records.filter(r => r.status === "attended").length, 0);
  const excCount = exceptionPlan.reduce((n, e) => n + e.entries.length, 0);
  const confirm = await kcDialog({
    title: "Confirm import",
    body: kcEl("div", {},
      kcEl("p", {}, "Months to add: " + (monthsToAdd.length ? monthsToAdd.join(", ") : "none")),
      kcEl("p", {}, "Children: " + plan.length + " (" + plan.filter(p => p.isNew).length + " new)"),
      kcEl("p", {}, "Attended records: " + attendedCount),
      kcEl("p", {}, "Absent/holiday days to add: " + excCount),
      kcEl("p", { className: "kc-muted" }, "Cleaned from file: " + stats.duplicates + " duplicate rows, " + stats.headerRows + " repeated header rows, " +
        stats.blankRows + " blank rows, " + stats.junkRows + " non-data rows removed.")),
    buttons: [{ id: "cancel", label: "Cancel" }, { id: "ok", label: "Import now", primary: true }]
  });
  if(confirm.id !== "ok") return;

  /* 6. commit (everything below goes through the project's own rules) */
  monthsToAdd.forEach(m => { if(!project.months.includes(m)){ project.months.push(m); report.months++; } });
  project.months.sort();

  for(const p of plan)
  {
    if(p.isNew)
    {
      project.children.push({ id: p.childId, name: p.name });
      if(!project.activeChildId) project.activeChildId = p.childId;
      report.children++;
    }
    for(const r of p.group.records)
      if(r.status === "attended" && kcAdd(p.childId, r.date, KC_IMPORT.TYPE_ATTENDED, r.start, r.end, report, p.label) === "added")
        report.attended++;
  }
  for(const e of exceptionPlan)
    for(const x of e.entries)
    {
      if(x.kind === "holiday")
      {
        const h = kcAdd(e.childId, x.date, KC_IMPORT.TYPE_HOLIDAY, x.start, x.end, report, e.label);
        if(h === "rejected") continue;               // don't add the paired Scheduled entry
        if(h === "added") report.holiday++;
      }
      if(kcAdd(e.childId, x.date, KC_IMPORT.TYPE_SCHEDULED, x.start, x.end, report, e.label) === "added") report.scheduled++;
    }

  saveProject();
  renderApp();

  const lines = [
    "Months added: " + report.months + ". Children added: " + report.children + ".",
    "Attended entries added: " + report.attended + ". Scheduled entries added: " + report.scheduled + ". Holiday entries added: " + report.holiday + ".",
    "Already present (not re-added): " + report.duplicate + ". Skipped for months not added: " + report.skippedMonth +
      ". Skipped for children/families not imported: " + report.skippedChildRecords + ". Absent/holiday days skipped: " + report.skippedExceptions + ".",
    "Rejected by project rules: " + report.rejected.length + "."
  ];
  const detail = report.rejected.concat(stats.invalid.map(s => "Unreadable row: " + s), stats.conflicts.map(s => "Conflict: " + s));
  await kcInfoDialog("Import complete", lines, detail);
}
// End of import functions
