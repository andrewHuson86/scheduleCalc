<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Center Simulator</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#222;font-size:14px}
  h1{font-size:20px;font-weight:600;padding:20px 24px 16px;border-bottom:1px solid #ddd;background:#fff}
  .container{max-width:1100px;margin:0 auto;padding:20px}
  .card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px}
  .card h2{font-size:14px;font-weight:600;margin-bottom:12px;color:#444;text-transform:uppercase;letter-spacing:.04em}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .g4{grid-template-columns:1fr 1fr 1fr 1fr}
  label{font-size:12px;color:#555;display:block;margin-bottom:4px}
  input,select{width:100%;padding:7px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;background:#fff;color:#222}
  input:focus,select:focus{outline:2px solid #4a7aff;border-color:#4a7aff}
  .row{display:flex;align-items:center;gap:8px}
  .row input[type=range]{flex:1}
  .row .val{min-width:38px;font-size:13px;font-weight:500;text-align:right}
  .radio-group{display:flex;gap:8px}
  .radio-group label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:#222;margin:0;font-weight:400}
  .radio-group input[type=radio]{width:auto}
  button#runBtn{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
  button#runBtn:hover{background:#1d4ed8}
  button#runBtn:disabled{background:#93c5fd;cursor:not-allowed}
  #status{text-align:center;font-size:13px;color:#555;margin-top:8px;min-height:20px}
  .results{display:none}
  .metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
  .metric{background:#f8f9ff;border:1px solid #e0e7ff;border-radius:8px;padding:12px 14px}
  .metric .mlabel{font-size:11px;color:#6b7280;margin-bottom:4px}
  .metric .mval{font-size:20px;font-weight:600;color:#1e293b}
  .metric .mval.good{color:#16a34a}
  .metric .mval.warn{color:#d97706}
  .metric .mval.bad{color:#dc2626}
  table.dist-table{width:100%;border-collapse:collapse;font-size:12px}
  table.dist-table th{background:#f1f5f9;padding:6px 8px;text-align:left;border-bottom:2px solid #e2e8f0;font-weight:600;color:#475569}
  table.dist-table td{padding:5px 8px;border-bottom:1px solid #f0f0f0}
  table.dist-table tr:last-child td{border-bottom:none}
  table.dist-table tr:nth-child(even) td{background:#fafafa}
  .worker-summary{font-size:12px;color:#555}
  .log-box{background:#0f172a;color:#94a3b8;font-size:11px;font-family:monospace;padding:12px;border-radius:6px;max-height:200px;overflow-y:auto;line-height:1.6}
  .prog-bar{width:100%;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:6px}
  .prog-fill{height:100%;background:#2563eb;border-radius:4px;transition:width .2s}
  .section-title{font-size:13px;font-weight:600;color:#374151;margin:16px 0 8px}
  .tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500}
  .tag.blue{background:#dbeafe;color:#1d4ed8}
  .tag.green{background:#dcfce7;color:#15803d}
  .tag.amber{background:#fef3c7;color:#92400e}
  .tag.red{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<h1>📞 Phone Center Simulator</h1>
<div class="container">

  <div class="card">
    <h2>Call Volume &amp; Schedule</h2>
    <div class="grid g3">
      <div>
        <label>Day of Week</label>
        <select id="weekday">
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
        </select>
      </div>
      <div>
        <label>Expected Calls (total for day)</label>
        <input type="number" id="numCalls" value="1200" min="1">
      </div>
      <div>
        <label>Avg Call Handle Time (seconds)</label>
        <input type="number" id="avgCallTime" value="1920" min="1">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Batch Cases</h2>
    <div class="grid g3">
      <div>
        <label>Current Backlogged Cases</label>
        <input type="number" id="backlogCases" value="5000" min="0">
      </div>
      <div>
        <label>New Batch Cases Expected Today</label>
        <input type="number" id="newBatchCases" value="500" min="0">
      </div>
      <div>
        <label>Avg Batch Handle Time (seconds)</label>
        <input type="number" id="avgBatchTime" value="1620" min="1">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Workforce &amp; Behavior</h2>
    <div class="grid g3">
      <div>
        <label>Number of Workers</label>
        <input type="number" id="numWorkers" value="130" min="1">
      </div>
      <div>
        <label>Call Active % (0–100)</label>
        <div class="row" style="margin-top:4px">
          <input type="range" id="callActivePct" min="0" max="100" value="90" step="1">
          <span class="val" id="callActivePctVal">70%</span>
        </div>
      </div>
      <div>
        <label>First Case Call</label>
        <div class="radio-group" style="margin-top:8px">
          <label><input type="radio" name="firstCase" value="yes" checked> Yes</label>
          <label><input type="radio" name="firstCase" value="no"> No</label>
        </div>
      </div>
    </div>
  </div>

  <button id="runBtn" onclick="runSimulation()">▶ Run Simulation</button>
  <div id="status"></div>
  <div class="prog-bar" style="display:none" id="progBar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>

  <div class="results" id="resultsSection">
    <div class="section-title">Simulation Results</div>

    <div class="metrics-grid" id="metricsGrid"></div>

    <div class="grid g2" style="gap:16px">
      <div class="card" style="margin:0">
        <h2>Worker Time Breakdown</h2>
        <div id="workerBreakdown"></div>
      </div>
      <div class="card" style="margin:0">
        <h2>Period-by-Period Call Activity</h2>
        <div style="overflow-y:auto;max-height:340px">
          <table class="dist-table" id="periodTable">
            <thead><tr><th>Period</th><th>Expected</th><th>Answered</th><th>Abandoned</th><th>Peak Queue</th></tr></thead>
            <tbody id="periodBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>Simulation Log (last events)</h2>
      <div class="log-box" id="logBox"></div>
    </div>
  </div>
</div>

function rand(){return Math.random();}
function randRange(a,b){return a+rand()*(b-a);}

function generateMaxWaitTime()
{
  const x = rand();
  const y = rand();
  return Math.round(((Math.pow(x,4)*160)+(Math.pow(x,2)*45)+(x*30)+(Math.pow(y,2)*10))*60);
}

function getPeriods(weekday)
{
  return DIST_TABLE.filter(d=>d.weekday===weekday && d.dist>0);
}

function periodStartSec(p){return (p-1)*1800;}
function periodEndSec(p){return p*1800;}

function generateCalls(numCalls,weekday,avgHandleTime){
  const periods=getPeriods(weekday);
  const totalDist=periods.reduce((s,p)=>s+p.dist,0);
  const calls=[];
  let id=0;
  for(const p of periods)
  {
    const count=Math.round(numCalls*(p.dist/totalDist));
    const start=periodStartSec(p.period);
    const end=periodEndSec(p.period);
    for(let i=0;i<count;i++)
	{
      calls.push({
        id:id++,
        callTime:Math.floor(randRange(start,end)),
        maxWaitTime:generateMaxWaitTime(),
        handleTime:Math.floor(randRange(0.5,2)*avgHandleTime),
        period:p.period,
        answered:false,
        abandoned:false,
        answerTime:null,
        waitTime:null
      });
    }
  }
  calls.sort((a,b)=>a.callTime-b.callTime);
  return calls;
}

function generateBatch(backlog,newCases,avgBatchTime)
{
  const cases=[];
  let id=0;
  for(let i=0;i<backlog;i++){
    cases.push({id:id++,genTime:0,handleTime:Math.floor(randRange(0.5,2)*avgBatchTime),worked:false});
  }
  const perPeriod=Math.ceil(newCases/18);
  for(let p=1;p<=18;p++){
    const start=periodStartSec(p);
    const end=periodEndSec(p);
    const cnt=(p<18)?perPeriod:Math.max(0,newCases-perPeriod*17);
    for(let i=0;i<cnt;i++){
      cases.push({id:id++,genTime:Math.floor(randRange(start,end)),handleTime:Math.floor(randRange(0.5,2)*avgBatchTime),worked:false});
    }
  }
  cases.sort((a,b)=>a.genTime-b.genTime);
  return cases;
}

function assignWorkerSchedules(numWorkers)
{
  const workers=[];
  const breakGroups=[4500, 5400, 9900, 14400, 18900]; // 9:15a -> 10:15a break start times
  for(let i=0;i<numWorkers;i++)
  {
    const b1Start=breakGroups[i%breakGroups.length];
    const lunchStart=b1Start+8100; // lunch 2.25 hours after break 1: 11:30a-12:30p
    const b2Start=lunchStart+10800; // break 2 3 hours after lunch: 2:30p-3:30p
    workers.push({
      id:i,
      state:'idle',
      nextAvailableTime:0,
      hasFirstCall:false,
      break1Sched:b1Start,
      lunchSched:lunchStart,
      break2Sched:b2Start,
      break1Done:false,
      lunchDone:false,
      break2Done:false,
      onBreak:false,
      breakEndTime:b1Start+900,
      timeInCall:0,
      timeInBatch:0,
      timeInIdle:0,
      callCount:0,
      batchCount:0
    });
  }
  return workers;
}

function fmt(sec)
{
  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  const s=Math.floor(sec%60);
  return h>0?`${h}h ${m}m`:`${m}m ${s}s`;
}

function fmtClock(sec)
{
  const base=28800; // 8am
  const t=base+sec;
  const h=Math.floor(t/3600)%12||12;
  const m=String(Math.floor((t%3600)/60)).padStart(2,'0');
  const ampm=t<12*3600?'am':'pm';
  return `${h}:${m}${ampm}`;
}

async function runSimulation()
{
  const btn=document.getElementById('runBtn');
  btn.disabled=true;
  document.getElementById('status').textContent='Initializing simulation...';
  document.getElementById('progBar').style.display='block';
  document.getElementById('progFill').style.width='0%';
  document.getElementById('resultsSection').style.display='none';

  await new Promise(r=>setTimeout(r,10));

  const weekday=parseInt(document.getElementById('weekday').value);
  const numCalls=parseInt(document.getElementById('numCalls').value)||1200;
  const avgCallTime=parseInt(document.getElementById('avgCallTime').value)||1920;
  const numWorkers=parseInt(document.getElementById('numWorkers').value)||100;
  const backlogCases=parseInt(document.getElementById('backlogCases').value)||5000;
  const newBatchCases=parseInt(document.getElementById('newBatchCases').value)||500;
  const avgBatchTime=parseInt(document.getElementById('avgBatchTime').value)||1620;
  const callActivePct=parseInt(document.getElementById('callActivePct').value)/100;
  const firstCaseCall=document.querySelector('input[name="firstCase"]:checked').value==='yes';

  const DAY_END=32400; // 9 hours after start, start = 8am = 0, end = 5pm = 32400 seconds

  document.getElementById('status').textContent='Generating call queue...';
  await new Promise(r=>setTimeout(r,10));

  const allCalls=generateCalls(numCalls,weekday,avgCallTime);
  const batchQueue=generateBatch(backlogCases,newBatchCases,avgBatchTime);
  const workers=assignWorkerSchedules(numWorkers);

  document.getElementById('progFill').style.width='10%';
  document.getElementById('status').textContent='Running simulation...';
  await new Promise(r=>setTimeout(r,10));

  // simulation state
  const activeCallQueue=[]; // calls that have arrived and are waiting
  let callQueueIdx=0; // pointer into allCalls
  let batchQueueIdx=0; // pointer into batchQueue
  const availBatch=[]; // batch cases available (genTime<=currentTime)

  // metrics
  let callsAnswered=0;
  let callsAbandoned=0;
  let batchWorked=0;
  let totalWaitTime=0;
  let maxWaitIncurred=0;
  let maxQueueSize=0;
  const logs=[];

  // period stats
  const periods=getPeriods(weekday);
  const periodStats={};
  for(const p of periods){
    periodStats[p.period]={expected:0,answered:0,abandoned:0,peakQ:0,str:p.str};
  }
  for(const c of allCalls){
    if(periodStats[c.period]) periodStats[c.period].expected++;
  }

  const SIM_END=DAY_END; // 32400
  let currentTime = 0;
  const MIN_STEP = 1; // Minimum 1 second per step. Maximum of 32400 steps per day

  function getNextEventTime()
  {
    let next=Infinity;
    // next call arrival
    if(callQueueIdx<allCalls.length && allCalls[callQueueIdx].callTime > currentTime) next=Math.min(next,allCalls[callQueueIdx].callTime);
    // next batch availability
    if(batchQueueIdx<batchQueue.length && batchQueue[batchQueueIdx].genTime > currentTime) next=Math.min(next,batchQueue[batchQueueIdx].genTime);
    // next worker available
    for(const w of workers)
	{
      if(w.nextAvailableTime > currentTime) next=Math.min(next,w.nextAvailableTime);
	  if(w.onBreak && w.breakEndTime>currentTime) next=Math.min(next,w.breakEndTime);
	  if(!w.break1Done && w.break1Sched>currentTime) next=Math.min(next,w.break1Sched);
      if(!w.lunchDone && w.lunchSched>currentTime) next=Math.min(next,w.lunchSched);
      if(!w.break2Done && w.break2Sched>currentTime) next=Math.min(next,w.break2Sched);
    }
    // next call expiry in active queue
    for(const c of activeCallQueue)
	{
      next=Math.min(next,c.callTime+c.maxWaitTime);
    }
    if(next===Infinity || next===currentTime) next=currentTime+MIN_STEP;
    return Math.min(next,SIM_END);
  }

  let iterations=0;
  const MAX_ITER=500000;

  while(currentTime < SIM_END && iterations < MAX_ITER)
  {
    iterations++;

    // advance new calls into active queue
    while(callQueueIdx<allCalls.length && allCalls[callQueueIdx].callTime<=currentTime){
      activeCallQueue.push(allCalls[callQueueIdx]);
      callQueueIdx++;
    }

    // advance new batch into available
    while(batchQueueIdx<batchQueue.length && batchQueue[batchQueueIdx].genTime<=currentTime){
      availBatch.push(batchQueue[batchQueueIdx]);
      batchQueueIdx++;
    }

    // expire calls that have exceeded maxWaitTime
    for(let i=activeCallQueue.length-1;i>=0;i--)
	{
      const c=activeCallQueue[i];
      if(currentTime>=c.callTime+c.maxWaitTime)
	  {
        c.abandoned=true;
        callsAbandoned++;
        if(periodStats[c.period]) periodStats[c.period].abandoned++;
        activeCallQueue.splice(i,1);
        logs.push(`[${fmtClock(currentTime)}] Call #${c.id} abandoned after ${fmt(currentTime-c.callTime)} wait`);
      }
    }

    // track queue size
    if(activeCallQueue.length>maxQueueSize) maxQueueSize=activeCallQueue.length;
	
    for(const p of periods)
	{
      if(periodStats[p.period] && activeCallQueue.length>periodStats[p.period].peakQ)
	  {
        // only count calls for this period
        const pStart=periodStartSec(p.period);
        const pEnd=periodEndSec(p.period);
        if(currentTime>=pStart && currentTime<pEnd)
		{
          periodStats[p.period].peakQ=activeCallQueue.length;
        }
      }
    }

    // process workers
    // sort by nextAvailableTime so earliest available goes first
    const sortedWorkers=[...workers].sort((a,b)=>a.nextAvailableTime-b.nextAvailableTime);

    for(const w of sortedWorkers)
	{
      if(w.onBreak)
	  {
        if(currentTime>=w.breakEndTime)
		{
          w.onBreak=false;
          w.nextAvailableTime=currentTime;
          logs.push(`[${fmtClock(currentTime)}] Worker ${w.id} returned from break/lunch`);
        }
        continue;
      }
      if(w.nextAvailableTime>currentTime) 
	  {
		continue;
	  }
	  
      // check if due for break/lunch before pulling a case
      let tookBreak = false;

      if(!w.break1Done && currentTime>=w.break1Sched)
	  {
        w.break1Done=true;
        w.onBreak=true;
        w.breakEndTime=currentTime+900;
        w.nextAvailableTime=w.breakEndTime;
        w.state='break';
        logs.push(`[${fmtClock(currentTime)}] Worker ${w.id} started break 1 (sched ${fmtClock(w.break1Sched)})`);
        tookBreak=true;
      } 
	  else if(!w.lunchDone && currentTime>=w.lunchSched)
	  {
        w.lunchDone=true;
        w.onBreak=true;
        w.breakEndTime=currentTime+3600;
        w.nextAvailableTime=w.breakEndTime;
        w.state='lunch';
        logs.push(`[${fmtClock(currentTime)}] Worker ${w.id} started lunch (sched ${fmtClock(w.lunchSched)})`);
        tookBreak=true;
      } 
	  else if(!w.break2Done && currentTime>=w.break2Sched)
	  {
        w.break2Done=true;
        w.onBreak=true;
        w.breakEndTime=currentTime+900;
        w.nextAvailableTime=w.breakEndTime;
        w.state='break';
        logs.push(`[${fmtClock(currentTime)}] Worker ${w.id} started break 2 (sched ${fmtClock(w.break2Sched)})`);
        tookBreak=true;
      }

      if(tookBreak) 
	  {
		continue;
	  }

      // attempt to take work
      let tookWork=false;

      // first case call logic
      const wantsCall=((firstCaseCall && !w.hasFirstCall) || (rand()<=callActivePct));

      if(wantsCall && activeCallQueue.length>0 && ((currentTime+avgCallTime) <= SIM_END))
	  {
        const call=activeCallQueue.shift();
        const waitTime=currentTime-call.callTime;
        call.answered=true;
        call.answerTime=currentTime;
        call.waitTime=waitTime;
        totalWaitTime+=waitTime;
        if(waitTime>maxWaitIncurred) maxWaitIncurred=waitTime;
        callsAnswered++;
        if(periodStats[call.period]) periodStats[call.period].answered++;
        w.hasFirstCall=true;
        w.timeInCall+=call.handleTime;
        w.nextAvailableTime=currentTime+call.handleTime;
        w.callCount++;
        w.state='call';
        logs.push(`[${fmtClock(currentTime)}] Worker ${w.id} answered call #${call.id} (wait ${fmt(waitTime)}, handle ${fmt(call.handleTime)})`);
        tookWork=true;
      } 
	  else if((availBatch.length>0) && ((currentTime+avgBatchTime) <= SIM_END) && !(firstCaseCall && !w.hasFirstCall && (currentTime < 600))) // wait max 10 minutes for first call when firstCaseCall
	  {
        const bc=availBatch.shift();
        bc.worked=true;
        batchWorked++;
        w.timeInBatch+=bc.handleTime;
        w.nextAvailableTime=currentTime+bc.handleTime;
        w.batchCount++;
        w.state='batch';
        logs.push(`[${fmtClock(currentTime)}] Worker ${w.id} took batch case #${bc.id} (handle ${fmt(bc.handleTime)})`);
        tookWork=true;
      }

      if(!tookWork)
	  {
        // worker is idle - track idle time until next step
        w.state='idle';
      }
    }

    // track idle time for this step
    const nextT=getNextEventTime();
    const stepDur=nextT-currentTime;
    for(const w of workers)
	{
      if(!w.onBreak && w.nextAvailableTime<=currentTime && w.state==='idle')
	  {
        w.timeInIdle+=stepDur;
      }
    }

    currentTime=nextT;

    if(iterations%5000===0)
	{
      const pct=Math.min(95,10+85*(currentTime/SIM_END));
      document.getElementById('progFill').style.width=pct+'%';
      document.getElementById('status').textContent=`Simulating... ${fmtClock(currentTime)} (${iterations.toLocaleString()} steps)`;
      await new Promise(r=>setTimeout(r,0));
    }
  }

  // after 5pm, disconnect remaining calls
  for(const c of activeCallQueue){
    c.abandoned=true;
    callsAbandoned++;
    if(periodStats[c.period]) periodStats[c.period].abandoned++;
  }

  document.getElementById('progFill').style.width='100%';
  document.getElementById('status').textContent=`Simulation complete. ${iterations.toLocaleString()} steps processed.`;

  // render results
  const totalWorkerTime=workers.reduce((s,w)=>s+w.timeInCall+w.timeInBatch+w.timeInIdle,0);
  const avgCallTimeWorker=workers.reduce((s,w)=>s+w.timeInCall,0)/numWorkers;
  const avgBatchTimeWorker=workers.reduce((s,w)=>s+w.timeInBatch,0)/numWorkers;
  const avgIdleTimeWorker=workers.reduce((s,w)=>s+w.timeInIdle,0)/numWorkers;
  const avgSpeed=callsAnswered>0?Math.round(totalWaitTime/callsAnswered):0;
  const answerRate=numCalls>0?Math.round(100*callsAnswered/numCalls):0;

  const metrics=[
    {label:'Calls Answered',val:callsAnswered.toLocaleString(),cls:answerRate>=80?'good':answerRate>=60?'warn':'bad'},
    {label:'Calls Abandoned',val:callsAbandoned.toLocaleString(),cls:callsAbandoned===0?'good':callsAbandoned<numCalls*0.2?'warn':'bad'},
    {label:'Answer Rate',val:answerRate+'%',cls:answerRate>=80?'good':answerRate>=60?'warn':'bad'},
    {label:'Batch Cases Worked',val:batchWorked.toLocaleString(),cls:''},
    {label:'Avg Speed to Answer',val:fmt(avgSpeed),cls:avgSpeed<120?'good':avgSpeed<300?'warn':'bad'},
    {label:'Max Wait Incurred',val:fmt(maxWaitIncurred),cls:''},
    {label:'Peak Queue Size',val:maxQueueSize.toLocaleString(),cls:''},
    {label:'Simulation Steps',val:iterations.toLocaleString(),cls:''},
  ];

  const mg=document.getElementById('metricsGrid');
  mg.innerHTML=metrics.map(m=>`<div class="metric"><div class="mlabel">${m.label}</div><div class="mval ${m.cls}">${m.val}</div></div>`).join('');

  const totalShiftSec=9*3600;
  const breakSec=15*60*2+3600;
  const workSec=totalShiftSec-breakSec;

  const wb=document.getElementById('workerBreakdown');
  wb.innerHTML=`
    <table class="dist-table">
      <thead><tr><th>Metric</th><th>Avg per Worker</th><th>% of Work Time</th></tr></thead>
      <tbody>
        <tr><td>Time on Calls</td><td>${fmt(avgCallTimeWorker)}</td><td>${Math.round(100*avgCallTimeWorker/workSec)}%</td></tr>
        <tr><td>Time on Batch</td><td>${fmt(avgBatchTimeWorker)}</td><td>${Math.round(100*avgBatchTimeWorker/workSec)}%</td></tr>
        <tr><td>Idle Time</td><td>${fmt(avgIdleTimeWorker)}</td><td>${Math.round(100*avgIdleTimeWorker/workSec)}%</td></tr>
        <tr><td>Calls Handled</td><td>${Math.round(workers.reduce((s,w)=>s+w.callCount,0)/numWorkers)}</td><td>—</td></tr>
        <tr><td>Batch Cases Handled</td><td>${Math.round(workers.reduce((s,w)=>s+w.batchCount,0)/numWorkers)}</td><td>—</td></tr>
      </tbody>
    </table>`;

  const pb=document.getElementById('periodBody');
  const periodRows=Object.values(periodStats).sort((a,b)=>a.period-b.period);
  pb.innerHTML=periodRows.map(p=>`
    <tr>
      <td>${p.str}</td>
      <td>${p.expected}</td>
      <td>${p.answered}</td>
      <td>${p.abandoned}</td>
      <td>${p.peakQ}</td>
    </tr>`).join('');

  const lb=document.getElementById('logBox');
  const lastLogs=logs.slice(-5000);
  lb.innerHTML=lastLogs.map(l=>`<div>${l}</div>`).join('');
  lb.scrollTop=lb.scrollHeight;

  document.getElementById('resultsSection').style.display='block';
  btn.disabled=false;
}
</script>
</body>
</html>
