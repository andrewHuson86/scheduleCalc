<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCCC Call Center Simulator</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#222;font-size:14px}
  h1{font-size:20px;font-weight:600;padding:20px 24px 16px;border-bottom:1px solid #ddd;background:#fff}
  .container{max-width:1100px;margin:0 auto;padding:20px}
  .card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px}
  .card h2{font-size:14px;font-weight:600;margin-bottom:12px;color:#444;text-transform:uppercase;letter-spacing:.04em}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .g4{grid-template-columns:1fr 1fr 1fr 1fr}
  label{font-size:12px;color:#555;display:block;margin-bottom:4px}
  input,select{width:100%;padding:7px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;background:#fff;color:#222}
  input:focus,select:focus{outline:2px solid #4a7aff;border-color:#4a7aff}
  .row{display:flex;align-items:center;gap:8px}
  .row input[type=range]{flex:1}
  .row .val{min-width:38px;font-size:13px;font-weight:500;text-align:right}
  .radio-group{display:flex;gap:8px}
  .radio-group label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:#222;margin:0;font-weight:400}
  .radio-group input[type=radio]{width:auto}
  button#runBtn{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
  button#runBtn:hover{background:#1d4ed8}
  button#runBtn:disabled{background:#93c5fd;cursor:not-allowed}
  #status{text-align:center;font-size:13px;color:#555;margin-top:8px;min-height:20px}
  .results{display:none}
  .metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
  .metric{background:#f8f9ff;border:1px solid #e0e7ff;border-radius:8px;padding:12px 14px}
  .metric .mlabel{font-size:11px;color:#6b7280;margin-bottom:4px}
  .metric .mval{font-size:20px;font-weight:600;color:#1e293b}
  .metric .mval.good{color:#16a34a}
  .metric .mval.warn{color:#d97706}
  .metric .mval.bad{color:#dc2626}
  table.dist-table{width:100%;border-collapse:collapse;font-size:12px}
  table.dist-table th{background:#f1f5f9;padding:6px 8px;text-align:left;border-bottom:2px solid #e2e8f0;font-weight:600;color:#475569}
  table.dist-table td{padding:5px 8px;border-bottom:1px solid #f0f0f0}
  table.dist-table tr:last-child td{border-bottom:none}
  table.dist-table tr:nth-child(even) td{background:#fafafa}
  .worker-summary{font-size:12px;color:#555}
  .prog-bar{width:100%;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:6px}
  .prog-fill{height:100%;background:#2563eb;border-radius:4px;transition:width .2s}
  .section-title{font-size:13px;font-weight:600;color:#374151;margin:16px 0 8px}
  .tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500}
  .tag.blue{background:#dbeafe;color:#1d4ed8}
  .tag.green{background:#dcfce7;color:#15803d}
  .tag.amber{background:#fef3c7;color:#92400e}
  .tag.red{background:#fee2e2;color:#991b1b}
</style>
</head>

      <div>

        <div class="radio-group" style="margin-top:8px">
          <label><input type="radio" name="overTimeEnabled" value="yes"> Yes</label>
          <label><input type="radio" name="overTimeEnabled" value="no" checked> No</label>
        </div>
      </div>

      <div>
        <label>Batch Prioritization Logic?</label>
        <div class="radio-group" style="margin-top:8px">

          <label><input type="radio" name="batchLogicEnabled" value="no"> No</label>
        </div>
      </div>

    </div>
  </div>

  <div class="card">
    <h2>Case Processing Data</h2>
    <div class="grid g3">
      <div>
        <label>Backlogged Cases</label>
        <input type="number" id="backlogCases" value="2000" min="0">
      </div>
      <div>

      </div>
      <div>

      </div>
    </div>
  </div>

  <div class="card">
    <h2>Workforce &amp; Behavior</h2>
    <div class="grid g3">
      <div>
        <label>Number of Workers</label>
        <input type="number" id="numWorkers" value="118" min="1">
      </div>
      <div>
        <label>Call Active % (0–100)</label>
        <div class="row" style="margin-top:4px">
          <input type="range" id="callActivePct" min="0" max="100" value="100" step="1">
          <span class="val" id="callActivePctVal">100%</span>
        </div>
      </div>
      <div>
        <label>First Case Call</label>
        <div class="radio-group" style="margin-top:8px">
          <label><input type="radio" name="firstCase" value="yes"> Yes</label>
          <label><input type="radio" name="firstCase" value="no" checked> No</label>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Caseload &amp; Growth</h2>

        <label>Approved Cases</label>

      </div>

	        </div>
      </div>

      <div></div>

        <label for = "reappSlider">Reapplication Rate: </label>

</div>

function advanceDate(date, days = 1)
{
	const newDate = new Date(date);
	newDate.setDate(newDate.getDate() + days);
	return newDate;
}

function formatDate(date = simDate)
{

}

function daysBetween(startDate, endDate) 
{
  const start = new Date(startDate);
  const end = new Date(endDate);
  const startUtc = Date.UTC(start.getFullYear(), start.getMonth(), start.getDate());
  const endUtc = Date.UTC(end.getFullYear(), end.getMonth(), end.getDate());

  return Math.trunc((endUtc - startUtc) / 86400000);
}

function addMonths(date, months)
{
	const result = new Date(date);
	result.setMonth(result.getMonth() + months);
	return result;
}
function getLastDate(date)
{
	return new Date(date.getFullYear(), date.getMonth() +1, 0);
}

function daysInMonth(dt)
{
	const myDate =  new Date(dt.getFullYear(), dt.getMonth(),1);
	return daysBetween(myDate, getLastDate(myDate))+1;
}

// returns between 0 and 1 in increments of .1 for percentage through the month, used for multiplier tables
function monthPercentage(date)
{
    const d = new Date(date);
    const day = d.getDate()-1;
    const daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();

    return Math.round((day / (daysInMonth-1)) * 10) / 10;
}

function rand()
{
	return Math.random();
}
function randRange(a,b)
{
	return a + rand() * (b-a);
}
function randNormal() 
{
    let u = 0, v = 0;
    while (u === 0) u = rand();
    while (v === 0) v = rand();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function gammaSample(k, theta) 
{
    if (k < 1) 
	{
        return gammaSample(k + 1, theta) * Math.pow(rand(), 1 / k);
    }

    const d = k - 1 / 3;
    const c = 1 / Math.sqrt(9 * d);

    while (true) 
	{
        let x = randNormal();
        let v = Math.pow(1 + c * x, 3);
        if (v <= 0) continue;

        let u = rand();
        if (u < 1 - 0.0331 * Math.pow(x, 4)) 
		{
            return d * v * theta;
        }
        if (Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) 
		{
            return d * v * theta;
        }
    }
}

function generateMaxWaitTime()
{
  /* 	modified this, it was generating too low on average, rarely get average wait times above 1hr with too much abandoning
		even though it is based on the normal distribution we see
		Added chance to put in specific wait group range
  */
  let x = rand();
  let y = rand();
  let z = rand();
  // NEW MOD
  let r = rand();
	if (r < .25)
	{
		return Math.floor(randRange(3600,14400));
	}
	if (r < .5)
	{
		return Math.floor(randRange(1800,10800));
	}
  // END MOD
  return Math.round(((Math.pow(z,4)*160)+(Math.pow(x,2)*45)+(x*30)+(Math.pow(y,2)*10))*60);
}

// n is the average handle time to center the distribution around
// stdDev is based on real data
function generatePhoneHandleTime(n)
{
	const stdDev = n / 1.5;
	let maxIt = 1000;
	
	while(maxIt > 0)
	{
		const u1 = rand();
		const u2 = rand();
		const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
		
		const result = Math.round(n + (z * stdDev));
		if((result >= 10) && (result <= 6 * n))
		{
			return result;
		}
		maxIt--;
	}
	return Math.floor(randRange((.5 * n),( n * 2))); // last ditch, don't want to loop forever
}
// n is the average handle time, used to base the distribution
function generateBatchHandleTime(n) 
{
    const k = 1.1; // fixed shape
    const theta = n / k;
	let maxIt = 1000;
	
	while(maxIt > 0)
	{
		const value = Math.round(gammaSample(k, theta));
		if((value > 0) && (value <= n *5.5))
		{
			return Math.max(1,value);
		}
		maxIt--;
	}
    return Math.floor(randRange((.5 * n),( n * 2))); // last ditch, don't want to loop forever
}

function generateCalls(numCalls,weekday,avgHandleTime)
{
  const periods=getPeriods(weekday);
  const totalDist=periods.reduce((s,p)=>s+p.dist,0);
  const calls=[];
 
  for(const p of periods)
  {
    const count=Math.round(numCalls*(p.dist/totalDist));
    const start=periodStartSec(p.period);
    const end=periodEndSec(p.period);
    for(let i=0;i<count;i++)
	{
		let waitTime = generateMaxWaitTime();
    	let callStart = Math.floor(randRange(start,end));
        calls.push({
        id:callerId++,
	    callId:id++,
        callTime:callStart,
        maxWaitTime:waitTime,
        handleTime:generatePhoneHandleTime(avgHandleTime),
        period:p.period,
        answered:false,
        abandoned:false,
		disconnect:false,
        answerTime:null,
        waitTime:null,
	maxFDs:Math.floor(randRange(0,16)),
	maxRecalls:Math.floor(randRange(0,8)),
	callBackIn:Math.floor(waitTime*(1+(1-Math.pow((14400-waitTime)/14400,2)) + (1-Math.pow((LINE_CLOSE-callStart)/LINE_CLOSE,2)))+30),	
	fdCallBackIn:Math.floor(randRange(20,60))
      });
    }
  }
  calls.sort((a,b)=>a.callTime-b.callTime);
  return calls;
}

// midPoint age is where ~50% remain
function oldBatchMult(daysOld, maxMidPoint = 30) 
{
    const minMultiplier = 0.05; 					// 95% reduction floor
    const midpoint = Math.max(maxMidPoint, 30);     // midPoint age is where ~50% remain
    const steepness = Math.min(0.03, .05*(maxMidPoint/midpoint));   // higher = faster drop

    return minMultiplier + (1 - minMultiplier) / (1 + Math.exp(steepness * (daysOld - midpoint)));
}

function createAssn(type, readyDate, avgBatchTime)
{
// if the readyDate is a workday, generate randomly throughout the day otherwise genTime is 0 (start of day)
  const myTime = Math.floor(isWorkday(readyDate)?randRange(0,DAY_END-1):0);
  const batchRow = BATCH_DATA_MAP[type];
  
  const myCase = {
      id:batchId++,
	  type:type,
      genTime:myTime,
      genDate: new Date(readyDate),
      handleTime:generateBatchHandleTime(Math.round(avgBatchTime * batchRow.AHTMult * (randRange(900,1100)/1000))),
      worked:false,
      daysToWork:0,
      priAddend:batchRow.priority,
	  get priority() {daysBetween(this.genDate, simDate) + this.priAddend}
      };
	return myCase;
}

// Used to store both existing batch from current backload and batch that will become available at a later date.
function generateBatch(backlog = 0,newCases,avgBatchTime, currQueue, simDate)
{
  const cases=currQueue;
  // create the backlog first
  if(backlog > 0)
  {
	// Move backward and add the cases that would have been generated that day, If batchLogicEnabled then limit the assignment types by max expected distribution by month
	// The older cases have a higher percentage chance to have been worked via a telephone call, the farther back we go the more we reduce the calculated number of cases down remaining from that date to compensate	
	let createdCases = 0;
	let daysBack = 1;
	
	let maxApps = batchLogicEnabled?Math.round(backlog * (randRange(900,1100)/1000) * MONTHLY_DIST_MAP[simDate.getMonth() + 1].ExistingAppDistMult):backlog;
	let maxPends = batchLogicEnabled?Math.round(backlog * (randRange(900,1100)/1000) * MONTHLY_DIST_MAP[simDate.getMonth() + 1].ExistingPendDistMult):backlog;
	
	// For simplicity, assume caseload has been constant, won't affect it too much
	while (createdCases < backlog)
	{
		let remain = backlog - createdCases;
		let backlogDate = advanceDate(new Date(simDate),0-daysBack);
		let dailyAssns = getTotalBatch(backlogDate, currentCaseLoad);
		let expectDays = Math.round(30*(backlog/dailyAssns));
		let ageMult = oldBatchMult(daysBack, expectDays);
		
		dailyAssns = Math.min(remain, Math.round(dailyAssns*ageMult)); // assns from this day are the total original * multiplier by age or remaining, whichever is lower
		ageMult = batchLogicEnabled?oldBatchMult(daysBack, expectDays*BATCH_DATA_MAP["SSPS"].maxRatToExp):ageMult;
		let numSSPS = Math.min(dailyAssns, Math.round(getSSPSCases(backlogDate, currentCaseLoad) * ageMult * (randRange(900,1100)/1000))); // create SSPS assignments from that date
			for(let i =0; i < numSSPS; i++)
			{
				cases.push(createAssn("SSPS", backlogDate, avgBatchTime));
				dailyAssns--;
				createdCases++;
			}
		ageMult = batchLogicEnabled?oldBatchMult(daysBack, expectDays*BATCH_DATA_MAP["Pend"].maxRatToExp):ageMult;
		let numPends = Math.min(maxPends, dailyAssns, Math.round(getPendCases(backlogDate, currentCaseLoad) * ageMult * (randRange(900,1100)/1000))); // create Pending Case assignments from that date
		for(let i =0; i < numPends; i++)
			{
				cases.push(createAssn("Pend", backlogDate, avgBatchTime));
				dailyAssns--;
				maxPends--;
				createdCases++;
			}
		ageMult = batchLogicEnabled?oldBatchMult(daysBack, expectDays*BATCH_DATA_MAP["App"].maxRatToExp):ageMult;
		let numApps = Math.min(maxApps, dailyAssns, Math.round(getAppCases(backlogDate, currentCaseLoad) * ageMult * (randRange(900,1100)/1000))); // create new App assignments from that date
		for(let i =0; i < numApps; i++)
			{
				cases.push(createAssn("App", backlogDate, avgBatchTime));
				dailyAssns--;
				maxApps--;
				createdCases++;
				uninitiatedApps++;
			}
		ageMult = batchLogicEnabled?oldBatchMult(daysBack, expectDays*BATCH_DATA_MAP["Other"].maxRatToExp):ageMult;
		let numOther = Math.max(dailyAssns,0);
		for(let i =0; i < numOther; i++) // create generic Other assignments from that date
			{
				cases.push(createAssn("Other", backlogDate, avgBatchTime));
				dailyAssns--;
				createdCases++;
			}
		daysBack++;
	}
  }

  BATCH_DATA_TABLE.filter(t => t.newType).forEach(a => {
		const dayMult = simDate.getDate()===3?a.specialSSPSCaseMult:isWeekday(simDate)?a.weekdaySplit:a.weekendSplit;
		const assignmentCount = Math.round(newCases * dayMult);

		for (let i = 0; i < assignmentCount; i++) 
		{
			cases.push(createAssn(a.type, simDate, avgBatchTime));
			if(a.type === "App")
			{
				uninitiatedApps++;
			}
		}
    });

  
  // batchQueue should only be orderded by date and time available
  cases.sort((a,b)=> {
	if(a.genDate !== b.genDate) 
	{
		return new Date(a.genDate) - new Date(b.genDate);
	}
	if(a.genTime !== b.genTime) 
	{
		return a.genTime-b.genTime;
	} 
	return a.id-b.id
	});
  return cases;
}

function assignWorkerSchedules(numWorkers)
{
  const dayWorkers=[];
  const breakGroups=[4500, 5400, 6300, 7200, 8100]; // 9:15a -> 10:15a break start times
  for(let i=0;i<numWorkers;i++)
  {
    const b1Start=breakGroups[i%breakGroups.length];
    const lunchStart=b1Start+8100; // lunch 2.25 hours after break 1: 11:30a-12:30p
    const b2Start=lunchStart+10800; // break 2 3 hours after lunch: 2:30p-3:30p
    dayWorkers.push({
      id:i,
      state:'idle',
      nextAvailableTime:0,
      hasFirstCall:false,
      break1Sched:b1Start,
      lunchSched:lunchStart,
      break2Sched:b2Start,
      break1Done:false,
      lunchDone:false,
      break2Done:false,
      onBreak:false,
      onPause:false,
      breakEndTime:b1Start+900,
      timeInCall:0,
      timeInBatch:0,
      timeInIdle:0,
      callCount:0,
      batchCount:0
    });
  }
  return dayWorkers;
}

function fmt(sec)
{
  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  const s=Math.floor(sec%60);
  return h>0?`${h}h ${m}m`:`${m}m ${s}s`;
}

function fmtClock(sec)
{
  const base=28800; // 8am
  const t=base+sec;
  const h=Math.floor(t/3600)%12||12;
  const m=String(Math.floor((t%3600)/60)).padStart(2,'0');
  const ampm=t<12*3600?'am':'pm';
  return `${h}:${m}${ampm}`;
}

function getWeekday(date)
{
	const day = date.getDay();
	return day === 0?7:day; //  1 = Monday 7 = Sunday
}

function isWeekday(date)
{
    return getWeekday(date) < 6;
}

function isWorkday(date)
{
	if(getWeekday(date) > 5)
	{
		return false;
	}
	return !isHoliday(date);
}

function isHoliday(date) 
{
    const year = date.getFullYear();
    const month = date.getMonth() + 1; // JS months are 0-based
    const day = date.getDate();

    // Returns: su, mo, tu, we, th, fr, sa
    const wkDay = ["su", "mo", "tu", "we", "th", "fr", "sa"][date.getDay()];

    let returnVal = false;

    // Compare dates ignoring time
    const sameDate = (d1, d2) =>
        d1.getFullYear() === d2.getFullYear() &&
        d1.getMonth() === d2.getMonth() &&
        d1.getDate() === d2.getDate();

    const addDays = (d, days) => {
        const result = new Date(d);
        result.setDate(result.getDate() + days);
        return result;
    };

    const firstMonday = (year, month) => {
        let d = new Date(year, month - 1, 1);
        while (d.getDay() !== 1) { // Monday
            d.setDate(d.getDate() + 1);
        }
        return d;
    };

    switch (month) 
    {

        case 1: // New Year's Day and MLK Day
            if (day === 1 || (day === 2 && wkDay === "mo")) {
                returnVal = true;
            } else {
                const mlkDay = addDays(firstMonday(year, 1), 14); // 3rd Monday
                if (sameDate(date, mlkDay)) {
                    returnVal = true;
                }
            }
            break;

        case 2: // Presidents Day
            {
                const presidentsDay = addDays(firstMonday(year, 2), 14); // 3rd Monday
                if (sameDate(date, presidentsDay)) {
                    returnVal = true;
                }
            }
            break;

        case 5: // Memorial Day
            {
                let memorialDay = new Date(year, 4, 31); // May 31
                while (memorialDay.getDay() !== 1) { // Monday
                    memorialDay.setDate(memorialDay.getDate() - 1);
                }
                if (sameDate(date, memorialDay)) {
                    returnVal = true;
                }
            }
            break;

        case 6: // Juneteenth
            if (year > 2021) {
                if (
                    day === 19 ||
                    (day === 18 && wkDay === "fr") ||
                    (day === 20 && wkDay === "mo")
                ) {
                    returnVal = true;
                }
            }
            break;

        case 7: // Independence Day
            if (
                day === 4 ||
                (day === 3 && wkDay === "fr") ||
                (day === 5 && wkDay === "mo")
            ) {
                returnVal = true;
            }
            break;

        case 9: // Labor Day
            {
                const laborDay = firstMonday(year, 9);
                if (sameDate(date, laborDay)) {
                    returnVal = true;
                }
            }
            break;

        case 11: // Veterans Day, Thanksgiving, Friday after
            if (
                day === 11 ||
                (day === 10 && wkDay === "fr") ||
                (day === 12 && wkDay === "mo")
            ) {
                returnVal = true;
            } else {
                let thanksgiving = new Date(year, 10, 1); // Nov 1
                while (thanksgiving.getDay() !== 4) { // Thursday
                    thanksgiving.setDate(thanksgiving.getDate() + 1);
                }
                thanksgiving = addDays(thanksgiving, 21); // 4th Thursday

                if (
                    sameDate(date, thanksgiving) ||
                    sameDate(date, addDays(thanksgiving, 1))
                ) {
                    returnVal = true;
                }
            }
            break;

        case 12: // Christmas and possible New Year's observation
            if (
                day === 25 ||
                (day === 24 && wkDay === "fr") ||
                (day === 26 && wkDay === "mo")
            ) {
                returnVal = true;
            }

            // New Year's Day observed on Dec 31 when Jan 1 is Saturday
            if (day === 31 && wkDay === "fr") {
                returnVal = true;
            }
            break;
    }

    return returnVal;
}

function getBatchMult(dt)
{
	let result = PERC_MONTH_MAP[monthPercentage(simDate)].batchDistMult;
    result *= WEEKDAY_DIST_MAP[getWeekday(dt)].batchMult;
    
    if (isWeekday(dt))
    {
        result *= MONTHLY_DIST_MAP[simDate.getMonth()+1].wrkdayBatchCaseMult;
    }
    else
    {
        result *= MONTHLY_DIST_MAP[simDate.getMonth()+1].wkendBatchCaseMult;
    }
	return result;
}

function getTotalBatch(dt, caseLoad, newCases = false)
{
	return getAppCases(dt, caseLoad, newCases) + getSSPSCases(dt, caseLoad) + getOtherCases(dt, caseLoad) + (newCases?0:getPendCases(dt, caseLoad));
}

function getAppCases(dt, caseLoad, newCases = false)
{
	let myMult = 1.0;
	let todayApps = caseLoad;
	if(newCases)
	{
		const monthData = MONTHLY_DIST_MAP[dt.getMonth()+1];
		let expectedAdditionalApps = Math.round(caseLoad * (1-caseLoadMultiplier) * monthData.annualAppDist);
		let expiringCases = Math.round(caseLoad * monthData.annualAppDist);
		let expectedReapps = Math.round(expiringCases * reappMult);
		let expectedReapproved = Math.round(expectedReapps * reAppApprovalRate);
		let newlyApproved = expectedAdditionalApps + (expiringCases - expectedReapproved);
		let requiredNewApps = Math.round(newlyApproved/appApprovalRate);
		let dailyAverage = Math.round(requiredNewApps/daysInMonth(dt));
		todayApps = Math.round((randRange(900,1100)/1000) * dailyAverage * PERC_MONTH_MAP[monthPercentage(dt)].batchDistMult);
	}
	else
	{
		myMult = getBatchMult(dt);
		myMult *= DAY_DIST_MAP[dt.getDate()].AppsOfBatch;
		myMult *= caseLoadMultiplier * (randRange(900,1100)/1000);
	}
	
	return Math.round(myMult * todayApps);
}
function getSSPSCases(dt, caseLoad)
{
	let myMult = 1.0;
	if (dt.getDate() === 3)
	{
		myMult *= PERC_MONTH_MAP[monthPercentage(simDate)].batchDistMult;
		myMult *= WEEKDAY_DIST_MAP[getWeekday(dt)].batchMult;
		myMult *= MONTHLY_DIST_MAP[simDate.getMonth()+1].specialSSPSCaseMult;
	}
	else
	{
		myMult = getBatchMult(dt);
	}
	myMult *= DAY_DIST_MAP[dt.getDate()].SSPSvBatch;
	
	return Math.round(myMult * caseLoad * (randRange(900,1100)/1000));
}

// Only used for existing batch
function getPendCases(dt, caseLoad)
{
	let myRecord = MONTHLY_DIST_MAP[dt.getMonth()+1];
	return Math.round(getAppCases(dt, caseLoad, false) * (myRecord.ExistingPendDistMult / myRecord.ExistingAppDistMult) * (randRange(900,1100)/1000));
}
function getOtherCases(dt, caseLoad)
{
// special case for April 20th additional caseLoad * .055 cases for summer change translation letters
let addend = 0;
let myMult = getBatchMult(dt);

if(dt.getDate() === 20)
{
	if(dt.getMonth() === 4)
	{
		addend = Math.round((caseLoad * .055));
	}
}
return addend + Math.round(myMult * caseLoad);
}

function getPhoneMult(dt)
{
       let result = WEEKDAY_DIST_MAP[getWeekday(dt)].callMult;
        result *= PERC_MONTH_MAP[monthPercentage(simDate)].callDistMult;
        result *= MONTHLY_DIST_MAP[simDate.getMonth()+1].UniqueCallersPerDayPerCase;
		if(dt.getDate() == 24 && dt.getMonth() === 12)
		{
			result = Math.round(.45 * result);
		}
	return result;
}

function generateDateList()
{
	const myDates = [];
	let iDate = new Date(simDate);
	let thisDayOf = 0;
	let thisWorkdayOf = 0;
	let curMon = iDate.getMonth();
    let simDateID = 0;

	while(iDate <= simEndDate)
	{
		if (iDate.getMonth() === curMon)
		{
			thisDayOf++;
		}
		else
		{
			curMon = iDate.getMonth();
			thisDayOf = 1;
			thisWorkdayOf = 0;
		}
		const workDayIs = isWorkday(iDate);
		const overTimeDayIs = ((!workDayIs) && (getWeekday(iDate)===6) && overtimeEnabled && (!isHoliday(advanceDate(iDate,-1))));
		const thisDay_start  = ((workDayIs)&&(overtimeEnabled))?-3600:0;
		const thisDay_end = DAY_END+((workDayIs)&&(overtimeEnabled))?3600:0;
		if(workDayIs)
		{
			thisWorkdayOf++;
		}
        simDateID++;

		myDates.push({
        id:simDateID,
		dt: new Date(iDate),
		batchMult:getBatchMult(iDate),
		phonesMult:getPhoneMult(iDate),
		isWorkDay:workDayIs,
		isOTDay:overTimeDayIs,
		workerMult:(workDayIs?Math.floor(randRange(75,100)):overTimeDayIs?Math.floor(randRange(10,40)):0)/100, /* TODO create a function for this that is better */
		// these need to be populated during runtime
		backlogStart:0,
		backlogEnd:0,
		batchWorked:0,
		callsAnswered:0,
		callsAbandoned:0,
		forcedDisconnects:0,
		oldestBatch:0,
		oldestApp:0,
		uninitiatedApps:0,
		totalWorkerTime:0,
		avgCallTimeWorker:0,
		avgBatchTimeWorker:0,
		avgIdleTimeWorker:0,
		avgSpeed:0,
		uniqueAnswered:0,
		callsToQueue:0,
		answerRate:0,
		abandonRate:0,
		totalWaitTime:0,
		numWorkers:0,
		caseLoadStart:0,
		approvedCases:0,
		maxWaitIncurred:0,
		maxQueueSize:0
		});
	iDate = advanceDate(iDate, 1);
	}
    return myDates;
}

// this should work the case (mark it worked in batch), remove it from the batch queue (can be in a random location) 
// Determine if it is an app or reapp by chance, either approve, pend, or deny and decrement uninitiatedApps
// If approved increment actualCaseLoad 
// If pended, set up a pend assignment for a future date between 1 and 16 days in the future
function processApp(appCase)
{
	appCase.worked = true;
	uninitiatedApps--;
	let myApprovalRate = 0;
	let myMonthData = MONTHLY_DIST_MAP[simDate.getMonth()+1];
	
	const index = availBatch.indexOf(appCase);
	if (index !== -1) 
	{
		availBatch.splice(index, 1);
	}
	if(rand() < reAppMult) // is a reapp
	{
		myApprovalRate = reAppApprovalRate;
	}
	else // is an App
	{
		myApprovalRate = appApprovalRate;
	}
	if(rand() <= ((myMonthData.ExistingAppDistMult/myMonthData.ExistingPendDistMult) * 0.6)) // it is pended
	{
		createAssn("Pend", advanceDate(simDate, randRange(1,16)), simAvgBatchTime);
	}
	else
	{
		if(rand() <= myApprovalRate)
		{
			actualCaseLoad++;
		}
		// otherwise it is denied
	}
}

function processPend(pendCase)
{
	pendCase.worked=true;
	let myApprovalRate = 0;
	const index = availBatch.indexOf(pendCase);
	if (index !== -1) 
	{
		availBatch.splice(index, 1);
	}
	if(rand() < reAppMult) // is a reapp
	{
		myApprovalRate = reAppApprovalRate;
	}
	else // is an App
	{
		myApprovalRate = appApprovalRate;
	}
	if(rand() <= myApprovalRate)
	{
		actualCaseLoad++;
	}
	// otherwise it is denied	
}

                const sortedWorkers=[...workers].sort((a,b)=>a.nextAvailableTime-b.nextAvailableTime);

                  // attempt to take work

                  if(wantsCall && activeCallQueue.length>0 && ((currentTime+avgCallTime) <= SIM_END))

			            const call=activeCallQueue.shift();

						if(rand() < 0.3 && availBatch.length > 0)
						{
							let myBatchCase = availBatch[Math.floor(randRange(0,availBatch.length-1))];

								processApp(myBatchCase); // uninitiated apps will be reduced by one, if approved actualCaseLoad will increase by 1
							}
							else if(myBatchCase.type === "Pend")
							{
								processPend(myBatchCase); 
							}
							else
							{
								const index = availBatch.indexOf(myBatchCase);
								if (index !== -1) 
								{
									availBatch.splice(index, 1);
								}
							}
						}
						
			            uniqueCallers.add(call.callId);
			            call.answered=true;
			            call.answerTime=currentTime;
			            call.waitTime=waitTime;
			            myDay.totalWaitTime+=waitTime;
			            if(waitTime > myDay.maxWaitIncurred) myDay.maxWaitIncurred=waitTime;
			            myDay.callsAnswered++;
			            w.hasFirstCall=true;
			            w.timeInCall+=call.handleTime;
			            w.nextAvailableTime=currentTime+call.handleTime;
			            w.callCount++;
			            w.state='call';
			            tookWork=true;
			            // If they will call back again today, set up the additional call in allCalls same callerId but new callId at new time
			            // most caller attributes will be the same except callBacks will be decremented by 2, and new call will have new handleTime
			            const newCallTime = currentTime + call.fdCallBackIn;
			            const newCallHandleTime = generatePhoneHandleTime(avgCallTime);
			            if((newCallTime <= LINE_CLOSE) && (call.maxRecalls > 2) && (rand() < 0.05)) // Only a small number of callers should call back once their call is handled
			            {
				            const index = allCalls.findIndex(e => !(e.answered || e.abandoned || e.disconnect) && e.callTime > newCallTime);
				            const newCall = {id:callerId++,
						            callId:call.callId,
						            callTime:newCallTime,
						            maxWaitTime:call.maxWaitTime,
						            handleTime:newCallHandleTime,
						            period:getPeriod(newCallTime),
						            answered:false,
						            abandoned:false,
						            disconnect:false,
						            answerTime:null,
						            waitTime:null,
						            maxFDs:call.maxFDs,
						            maxRecalls:Math.max(0,call.maxRecalls-2),
						            callBackIn:Math.floor(call.maxWaitTime*(1+(1-Math.pow((14400-call.maxWaitTime)/14400,2)) + (1-Math.pow((LINE_CLOSE-currentTime)/LINE_CLOSE,2)))+30),	
						            fdCallBackIn:call.fdCallBackIn
						            };
				            if(index === -1)
				            {
					            allCalls.push(newCall);
				            }
				            else
				            {
					            allCalls.splice(index, 0, newCall);
				            }
				            myDay.numCalls++;
			            }
                  } 
	              else if((availBatch.length>0) && ((currentTime+avgBatchTime) <= SIM_END) && !(firstCaseCall && !w.hasFirstCall && (currentTime < 600))) // wait max 10 minutes for first call when firstCaseCall
	              {
                    const bc=availBatch.shift();
					if(bc.type === "App")
					{
						processApp(bc);
					}
					else if(bc.type === "Pend")
					{
						processPend(bc);
					}
					bc.daysToWork = daysBetween(bc.genDate, simDate);
                    bc.worked=true;
                    myDay.batchWorked++;
                    w.timeInBatch+=bc.handleTime;
                    w.nextAvailableTime=currentTime+bc.handleTime;
                    w.batchCount++;
                    w.state='batch';
                    tookWork=true;
                  }

                  if(!tookWork)
	              {
                    // worker is idle - track idle time until next step
                    w.state='idle';
                  }
                }

                // track idle time for this step
                const nextT=getNextEventTime();
                const stepDur=nextT-currentTime;
                for(const w of workers)
	            {
                  if(!w.onBreak && w.nextAvailableTime<=currentTime && w.state==='idle')
	              {
                    w.timeInIdle+=stepDur;
                  }
                }

                currentTime=nextT;

                if(totalIterations%5000===0)
	            {
                  console.log(5 + 95*((currentTime+((simDay-1)*SIM_END))/(maxSimDays*SIM_END)));
                  /*
				  document.getElementById('progFill').style.width=pct+'%';
                  document.getElementById('status').textContent=`Simulating... ${fmtClock(currentTime)} (${totalIterations.toLocaleString()} steps)`;
                */
				}
          }

          // after 5pm, disconnect remaining calls  
          for(const c of activeCallQueue)
          {
            c.abandoned=true;
            myDay.callsAbandoned++;
            if(rand() <= 0.3) // Some will call back tomorrow
            {
                carryCalls++;
            }
          }
		 
		// End of day stats
		myDay.backlogEnd = availBatch.length;
		myDay.approvedCases = actualCaseLoad;
		myDay.totalWorkerTime = workers.reduce((s,w)=>s+w.timeInCall+w.timeInBatch+w.timeInIdle,0);
		myDay.avgCallTimeWorker = workers.reduce((s,w)=>s+w.timeInCall,0)/myDay.numWorkers;
		myDay.avgBatchTimeWorker = workers.reduce((s,w)=>s+w.timeInBatch,0)/myDay.numWorkers;
		myDay.avgIdleTimeWorker = workers.reduce((s,w)=>s+w.timeInIdle,0)/myDay.numWorkers;
		myDay.avgSpeed=myDay.callsAnswered > 0?Math.round(myDay.totalWaitTime/myDay.callsAnswered):0;
		myDay.uniqueAnswered = uniqueCallers.size; // ?
		myDay.callsToQueue = myDay.callsAnswered + myDay.callsAbandoned;
		myDay.answerRate=id > 0?Math.round(100*myDay.uniqueAnswered/id):0; // is this right?
		myDay.abandonRate = (myDay.callsAnswered + myDay.callsAbandoned) > 0?Math.round(100* myDay. callsAbandoned/(myDay.callsAnswered + myDay.callsAbandoned)):0;

        simDate = advanceDate(simDate, 1);
        simDay++;
  }

  // Here the simulation run is complete, get table ready for all data and ready for export data, or continue running with modified parameters.
  // TODO: at this point the data from the current run should be added to the data table, buttons to export to excel should become visible, and certain inputs should be locked with the option to
  // continue running (potentially with some options changed or modified) or to reset the Simulator
  // Data should be daily data points for the run, need to update this part
  
  /*
  document.getElementById('progFill').style.width='100%';
  document.getElementById('status').textContent=`Simulation complete. ${iterations.toLocaleString()} steps processed.`;
*/
  // render results
  renderTable(myDates);
  

  btn.disabled=false;
}

  function getNextEventTime()
  {
    let next=Infinity;
    // next call arrival
    if(callQueueIdx<allCalls.length && allCalls[callQueueIdx].callTime > currentTime) next=Math.min(next,allCalls[callQueueIdx].callTime);
    // next batch availability
    if(batchQueueIdx<batchQueue.length && batchQueue[batchQueueIdx].genTime > currentTime) next=Math.min(next,batchQueue[batchQueueIdx].genTime);
    // next worker available
    for(const w of workers)
	{
      if(w.nextAvailableTime > currentTime) next=Math.min(next,w.nextAvailableTime);
      // if(w.onBreak && w.breakEndTime>currentTime) next=Math.min(next,w.breakEndTime);
      if(!w.break1Done && w.break1Sched>currentTime) next=Math.min(next,w.break1Sched);
      if(!w.lunchDone && w.lunchSched>currentTime) next=Math.min(next,w.lunchSched);
      if(!w.break2Done && w.break2Sched>currentTime) next=Math.min(next,w.break2Sched);
    }
    // next call expiry in active queue
    for(const c of activeCallQueue)
	{
      next=Math.min(next,c.callTime+c.maxWaitTime);
    }
    if(next===Infinity || next===currentTime) next=currentTime+MIN_STEP;
    return Math.min(Math.ceil(next), SIM_END);
  }

// TODO: make this better.
function renderTable(data) 
{
    if (!data.length) return;

    const columns = Object.keys(data[0]);

    let html = "<table border='1' style='border-collapse:collapse'>";
    
    html += "<thead><tr>";
    columns.forEach(col => {
        html += `<th>${col}</th>`;
    });
    html += "</tr></thead><tbody>";

    data.forEach(row => {
        html += "<tr>";

        columns.forEach(col => {
            let value = row[col];

            if (value instanceof Date) {
                value = value.toLocaleDateString();
            }

            html += `<td>${value}</td>`;
        });

        html += "</tr>";
    });

    html += "</tbody></table>";

    document.getElementById("resultsTable").innerHTML = html;
	document.getElementById('resultsSection').style.display = 'block';
}
